<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-13","about":"Preflight report for BloomBooks/BloomDesktop PR #8572, branch BL-17117-nightly-vitest-crash (card BL-17117)","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bl-17117-nightly-vitest-crash.html","context":["<p><!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Merged<\/span><!-- pr-state:end --> · Mergeable · All reviewers clean · 3 decisions waiting<\/p>","<p><a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8572\" target=\"_blank\" rel=\"noopener\">PR #8572<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8572/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8572/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17117\" target=\"_blank\" rel=\"noopener\">BL-17117<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8572\" target=\"_blank\" rel=\"noopener\">Devin review<\/a><\/p>","<h3>Problem<\/h3><p>Now and then the nightly's browser UI test run (vitest) dies with exit code 3221225477, a native access violation inside Node, part way through the suite. No test fails and the log doesn't say where it died. It has happened three times in five weeks (TeamCity on Oct 8 and Nov 3, the nightly on Nov 13), at a different point in the suite each time, with no test file in common and no front-end change since the night before. No test worker loads a native add-on, which rules out the best-known Node cause. Without a crash dump the cause can't be found.<\/p>","<h3>What the PR does<\/h3><p>It doesn't fix the crash. It collects the evidence needed to find the cause.<\/p><ul><li>Just before the vitest step, the nightly tells Windows to write a minidump of any <code>node.exe<\/code> that crashes (<a href=\"https://github.com/BloomBooks/BloomDesktop/blob/9cf73b366c9089ecd06e359e2b43b10aecc5e93b/.github/workflows/nightly.yml#L142\" target=\"_blank\" rel=\"noopener\">nightly.yml:142<\/a>). Right after it, even on failure or cancellation, it turns that off (<a href=\"https://github.com/BloomBooks/BloomDesktop/blob/9cf73b366c9089ecd06e359e2b43b10aecc5e93b/.github/workflows/nightly.yml#L181\" target=\"_blank\" rel=\"noopener\">:181<\/a>).<\/li><li>When the tests fail and a dump exists, it is uploaded as the <code>vitest-crash-dumps<\/code> artifact, kept 4 days like the other diagnostics (<a href=\"https://github.com/BloomBooks/BloomDesktop/blob/9cf73b366c9089ecd06e359e2b43b10aecc5e93b/.github/workflows/nightly.yml#L193\" target=\"_blank\" rel=\"noopener\">:193<\/a>). A night without a crash uploads nothing.<\/li><li>Dumps are on only around the vitest step, which gets no secrets; the setting is machine-wide and the later e2e step has a password in its environment.<\/li><\/ul>","<h3>Quality gate<\/h3><ul><li>YAML parses; step order and conditions checked. Pre-commit hooks passed.<\/li><li>TypeScript tests: not run — no front-end code in the diff (the unit suite was run once locally as part of the investigation).<\/li><li>C# tests: not run — no C# in the diff.<\/li><li>Repo check (e2e specs at nightly size): did not apply — no spec changed.<\/li><li>Merge: branch is on current master.<\/li><\/ul>","<h3>This run<\/h3><p>Committed the change, applied the security review's notes, and moved the new step so the vitest step's existing comment stays beside it. <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8572/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a>.<\/p>","<h3>Reviewers<\/h3><ul><li><b>Security review<\/b> (Fable 5.2 sub-agent, requested by Andrew): PASS. Its four low notes: two applied (comment on what a minidump holds; keep the upload directly after turn-off), plus a Windows-style dump path; two left (pre-existing <code>persist-credentials<\/code> default, and the self-hosted-runner case, which doesn't apply).<\/li><li><b>Local review<\/b> (light, inline): one fix — the new step had separated the vitest step from its comment.<\/li><li><b>Walkaround<\/b>: nothing to change.<\/li><li><b>Devin<\/b>: complete — no bugs, no flags.<\/li><li><b>Greptile<\/b>: complete — no comments, \"appears safe to merge\".<\/li><li><b>CI<\/b>: pr-automation passed; no-dependency-changes skipped.<\/li><\/ul>","<h3>Worth knowing<\/h3><ul><li>Not proven on a runner yet: neither that turning dumps on succeeds there (it needs admin rights) nor that Windows writes the dump when node crashes. If turning on fails, the browser UI tests are skipped that night and the job goes red.<\/li><\/ul>"],"questions":[{"title":"Test of the change","context":["<p>Every PR needs an automated test of what it changes, or your decision that it doesn't need one. This PR only changes the nightly workflow file. There is no unit test that can exercise a GitHub Actions step; the way to check it is to run the workflow (next question).<\/p>"],"options":[{"label":"No test needed: CI workflow change, checked by running the nightly","recommended":true,"why":"Recommended because the only thing that can test a workflow step is running the workflow.","effort":"no code — records the reason on the PR","instruction":"On BloomBooks/BloomDesktop PR #8572 (branch BL-17117-nightly-vitest-crash), record in the PR description's Automated Tests section: \"Test of the change: none — developer's decision: CI workflow change; checked by running the nightly.\""}],"leaveAsIs":"the PR's test decision stays 'awaiting', so it can't be promoted yet."},{"title":"Run the nightly on this branch now, front-end tests only?","context":["<p>A manual run of the nightly on this branch (workflow_dispatch with only <code>run_frontend_tests<\/code> on) would prove that turning dumps on and off works on GitHub's runner, about 10 minutes. It can't prove a dump gets written, because that needs a real crash. Otherwise the first proof comes from the first nightly after merging.<\/p>"],"options":[{"label":"Yes, dispatch it, front-end tests only","recommended":true,"why":"Recommended because it catches a failing turn-on step (which would skip the browser UI tests every night) before it reaches master.","effort":"~10 min of a runner, no code","instruction":"Run `gh workflow run nightly.yml --repo BloomBooks/BloomDesktop --ref BL-17117-nightly-vitest-crash -f run_frontend_tests=true -f run_csharp_tests=false -f run_e2e_tests=false -f run_component_tests=false -f run_visual_regression=false`, wait for it, and confirm the 'Turn on crash dumps for the browser UI tests' and 'Turn off crash dumps' steps succeeded and the browser UI tests ran. Report the result."}],"leaveAsIs":"the steps are first exercised by the first nightly after merge."},{"title":"Also capture dumps on TeamCity?","context":["<p>Two of the three crashes were on TeamCity's master build (agent <code>ba-bloom-win11<\/code>), which this PR can't reach: the setting lives on the machine. Turning it on there (registry key <code>HKLM\\SOFTWARE\\Microsoft\\Windows\\Windows Error Reporting\\LocalDumps\\node.exe<\/code> with DumpFolder, DumpType=1, DumpCount=3) would roughly double the chances of catching a dump. It would stay on for every node.exe on that agent, so it needs someone who admins the agent, and the dumps stay on that machine (not public).<\/p>"],"options":[{"label":"Write the exact steps for whoever admins the agent","recommended":true,"why":"Recommended because it doubles the chances at no cost to the repo, and the dumps stay private.","effort":"no code — a short note","instruction":"Write a short note (in chat, and as a comment on YouTrack card BL-17117) with the exact PowerShell to turn on WER LocalDumps minidumps for node.exe on TeamCity agent ba-bloom-win11 (folder, DumpType 1, DumpCount 3), how to find a dump after a crash, and how to turn it off again."}],"leaveAsIs":"only the GitHub nightly collects dumps."},{"title":"Next step","context":["<p>What should happen after these answers?<\/p>"],"options":[{"label":"Do the recommended items, then stop","recommended":true,"why":"Recommended because the PR is otherwise clean.","effort":"small","instruction":"Carry out the answers above for PR #8572, then stop; leave the PR as a draft."},{"label":"Discuss first","why":"","effort":"none","instruction":"Don't act yet; discuss the answers with me first."}],"leaveAsIs":"nothing further happens."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
