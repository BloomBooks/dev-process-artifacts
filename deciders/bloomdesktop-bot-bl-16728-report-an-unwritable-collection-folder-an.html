<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-19","about":"BloomBooks/BloomDesktop PR #8547, branch bot/bl-16728-report-an-unwritable-collection-folder-an (BL-16728), preflight at 76299145c5","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bot-bl-16728-report-an-unwritable-collection-folder-an.html","context":["<b>Preflight report: BL-16728, report an unwritable collection folder and offer the chooser instead of exiting.<\/b> Clean on every gate; two follow-up questions for you. <!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Draft PR<\/span><!-- pr-state:end --> · mergeable · bots: quiet","<a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547\" target=\"_blank\" rel=\"noopener\">PR #8547<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-16728\" target=\"_blank\" rel=\"noopener\">BL-16728<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8547\" target=\"_blank\" rel=\"noopener\">Devin review<\/a>","<b>Problem.<\/b> When Bloom couldn't write in a collection's folder, it showed a message blaming Windows Defender and quit, both while opening the collection and at startup when that collection was the last one open, so the user never got to pick another collection. It blamed Defender for every cause. BL-17056's check for antivirus that blocks only some of what Bloom does to books reported only through a small toast.","<b>Cause.<\/b> The check ran inside the <code>CollectionSettings<\/code> constructor, on every settings read, and called <code>Environment.Exit<\/code>, skipping the cleanup and recovery that opening a collection normally does when it fails.","<b>What the PR does.<\/b> One Bloom dialog for every case: \"This program cannot write to the folder {0}.\" naming the folder, then either the antivirus paragraph with a link to troubleshooting-file-access or the permission / read-only paragraph with a link to windows-file-permissions, plus any likely cause the BL-17056 diagnostics found. It works before any collection is open (the server is started first and links are handled at application level). Opening a collection checks its folder before any Team Collection sync and then offers the chooser; creating one explains and leaves the user where they were; BL-17056's background check now shows the dialog instead of a toast. Reading settings no longer checks, so command-line runs can read collections they can't change. At startup Bloom only tries to make the downloaded-books collection, and a download into it explains if it can't be written.","<b>Quality gate.<\/b> C# build: passes. C# tests: <span class=\"numeral\">735 passed, 0 failed<\/span> (the touched classes plus Team Collection, bulk upload, book storage, problem report, spreadsheet, change-layout and master's new LocalizationIdTests). TypeScript: not run, no front-end change. E2E repo check: did not apply, no spec changed. Merge with master: merged, clean.","<b>What changed this run.<\/b> Did your decisions: Bloom starts without the downloaded-books collection, and a download into it explains instead of failing vaguely; one HTML dialog with a link replaces both the message box and the BL-17056 toast; the old Defender paragraph is obsolete and the toast strings are deleted. Then fixed what the reviewers found (an existing unwritable downloads folder wasn't checked; a refused Collections folder still crashed startup) and reused Bloom's link and form helpers. Checked the dialog by hand in a running Bloom. <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a>.","<b>Reviewers.<\/b> Local review (light sub-agent pass): 1 found, 1 fixed. Walkaround with <code>/simplify<\/code>: reused <code>BookStorage<\/code>'s link helper and <code>Shell.GetShellOrOtherOpenForm<\/code>, made the downloads code throw one exception type, corrected comments; two proposals here. Devin: complete on <code>76299145c5<\/code>; all four bugs it raised over the PR are fixed and it marks them resolved (the latest: a refused Collections folder still crashed startup). Greptile: last reviewed <code>9d26957e02<\/code>; re-triggered for the dialog rework but it has not reviewed the current code. CI (Bot PR dependencies, PR Automation): passed on <code>76299145c5<\/code>.","<b>Worth knowing.<\/b> The dialog was checked by hand on <code>7875e94c44<\/code> (switching to a denied collection showed it with the folder, the permission wording and the link, no scrolling, and Close brought back the chooser); the link was not clicked, and the startup and antivirus cases were not tried by hand. The PR description is still the Bloom bot's (a workflow restores it); the current summary is in <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547#issuecomment-6989982070\" target=\"_blank\" rel=\"noopener\">a PR comment<\/a>."],"questions":[{"title":"A shared \"get ready to show a dialog\" step?","context":["Showing a Bloom dialog before any collection is open needs two calls first: hide the splash screen and make sure the local server is listening. Four places now do this by hand: the \"collection needs a newer Bloom\" check and the collection chooser in <code>Program.cs<\/code>, spreadsheet import, and this PR's <code>DefenderFolderProtectionCheck.ShowOnUiThread<\/code>. A <code>/simplify<\/code> reviewer suggested one helper. Putting it inside <code>ReactDialog<\/code> itself would be wrong: starting the server can exit Bloom if it fails, and the error reporter deliberately falls back to a plain dialog rather than starting the server."],"options":[{"label":"Make a follow-up card","recommended":true,"why":"Recommended because it touches three places outside this PR; it is a small tidy-up, not a bug.","effort":"no code here; a YouTrack card (the helper itself ~15 lines)","instruction":"Create a YouTrack card on the Bloom 6.6 board: 'One helper to get ready for a dialog before a collection is open', describing the four places that call StartupScreenManager.HideSplashScreenForDialog() and BloomServer EnsureListening() by hand before showing a ReactDialog (Program.cs minimum-version gate and ChooseACollection, SpreadsheetImportCommand, DefenderFolderProtectionCheck.ShowOnUiThread) and proposing a single static helper they all call, not inside ReactDialog. Link it from BL-16728."}],"leaveAsIs":"each of the four places keeps its own two calls."},{"title":"Check the folder before a download \"for editing\" too?","context":["A download into the downloaded-books collection now checks that folder first and explains if Bloom can't write there. A download <i>for editing<\/i> goes into a new collection under Documents\\Bloom instead, and isn't checked: if Windows refuses, the user gets the generic \"There was a problem downloading your book\" message after the book has downloaded. A <code>/simplify<\/code> reviewer noticed. The destination there may not exist yet, so the check would have to make it or test the nearest folder above it."],"options":[{"label":"Make a follow-up card","recommended":true,"why":"Recommended because it is a separate path from this card's, needs a little design (what to test when the folder doesn't exist yet), and is no worse than before.","effort":"no code here; a YouTrack card","instruction":"Create a YouTrack card on the Bloom 6.6 board: 'Explain an unwritable Documents\\Bloom before downloading a book for editing', noting that BookDownload.OnDoDownload checks the downloaded-books collection (DownloadFolderIsReady, BL-16728) but not NewCollectionWizard.DefaultParentDirectoryForCollections for ForEdit downloads, so an unwritable destination ends in the generic download error; the fix should test the nearest existing folder and report with DefenderFolderProtectionCheck.ReportProblem. Link it from BL-16728."},{"label":"Do it now, in this PR","why":"Covers both download paths at once.","effort":"~15 lines plus a test; low-moderate risk","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\bot-bl-16728-report-an-unwritable-collection-folder-an (branch bot/bl-16728-report-an-unwritable-collection-folder-an, PR #8547), in BookDownload.OnDoDownload, for ForEdit downloads check that Bloom can write in NewCollectionWizard.DefaultParentDirectoryForCollections (creating it if missing, wrapping a refusal in CollectionFolderNotWritableException) and report with DefenderFolderProtectionCheck.ReportProblem instead of downloading. Add a test and run the related tests."}],"leaveAsIs":"a download for editing into an unwritable Documents\\Bloom still ends with the generic download error."},{"title":"Next step","context":["What should happen once these are answered?"],"options":[{"label":"Do my choices; no more preflight unless code changes","recommended":true,"why":"Recommended because both recommended answers are cards, which don't change the code.","effort":"depends on the choices","instruction":"Carry out the decisions above for PR #8547 (branch bot/bl-16728-report-an-unwritable-collection-folder-an). If any of them changes code, run /preflight again; otherwise stop."},{"label":"Do my choices, then re-run preflight","why":"For a full fresh check.","effort":"depends on the choices","instruction":"Carry out the decisions above on PR #8547 (branch bot/bl-16728-report-an-unwritable-collection-folder-an), then run /preflight again."}],"leaveAsIs":"nothing more happens until I say."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
