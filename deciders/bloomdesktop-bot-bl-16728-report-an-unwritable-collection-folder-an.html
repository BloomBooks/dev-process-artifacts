<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>

<script type="application/json" id="decider-form">{"date":"2026-11-18","about":"BloomBooks/BloomDesktop PR #8547, branch bot/bl-16728-report-an-unwritable-collection-folder-an (BL-16728), preflight at 8541fed7cf","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bot-bl-16728-report-an-unwritable-collection-folder-an.html","context":["<b>Preflight report: BL-16728, report an unwritable collection folder and offer the chooser instead of exiting.<\/b> Clean on every gate; two items wait on you. <!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Draft PR<\/span><!-- pr-state:end --> · mergeable · bots: quiet","<a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547\" target=\"_blank\" rel=\"noopener\">PR #8547<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-16728\" target=\"_blank\" rel=\"noopener\">BL-16728<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8547\" target=\"_blank\" rel=\"noopener\">Devin review<\/a>","<b>Problem.<\/b> When Bloom couldn't write in a collection's folder, it showed a message blaming Windows Defender and quit, both while opening the collection and at startup when that collection was the last one open, so the user never got to pick another collection. It blamed Defender for every cause, including a read-only folder or a share without write permission.","<b>Cause.<\/b> The check ran inside the <code>CollectionSettings<\/code> constructor and called <code>Environment.Exit<\/code>, skipping the cleanup and recovery that opening a collection normally does when it fails.","<b>What the PR does.<\/b> Opening a collection for editing checks its folder (in the ProjectContext constructor, before any Team Collection sync) and, if Bloom can't write there, explains and offers the collection chooser instead of quitting. Creating a collection there (including where Windows won't even make the folder) explains and leaves the user where they were. Reading a collection's settings no longer checks, so command-line runs and bulk upload can read collections they can't change. The message follows BL-17056's evidence: antivirus suspected gets the virus-protection message and the troubleshooting-file-access page; access denied otherwise gets the new permission / read-only message and the windows-file-permissions page; any other likely cause (such as OneDrive) is added. At startup Bloom checks only Documents, and only when there is no recent collection.","<b>Quality gate.<\/b> C# build: passes. C# tests: <span class=\"numeral\">583 passed, 0 failed<\/span> (the classes the change touches, plus BulkUploader, spreadsheet, change-layout and Team Collection tests). TypeScript: not run, no front-end change. E2E repo check: did not apply, no spec changed. Merge with master: merged, clean.","<b>What changed this run.<\/b> Did your decisions 1–3: <code>Errors.FolderNotWritable<\/code> moved to <code>Bloom.xlf<\/code>; the permission message opens windows-file-permissions; the check moved out of the settings read path. Along the way: creating a collection where Windows won't make the folder now explains instead of crashing; command-line runs skip the check; reading an older collection on a read-only share no longer fails on the one-time settings save (Devin). <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a>.","<b>Reviewers.<\/b> Local review (light sub-agent pass): clean. Walkaround with <code>/simplify<\/code> (two passes): moved the check next to the code that reports it, made command-line runs skip it, corrected comments and translator notes; one proposal here (item 1). Devin: complete on <code>8541fed7cf<\/code>; its three bugs over the PR (Team Collection order, <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547#discussion_r4622033358\" target=\"_blank\" rel=\"noopener\">older read-only collections<\/a>, and earlier the cloud-folder flag) are fixed and it marks them resolved; it repeats two old flags against lines that have changed, both threads already resolved. Greptile: reviewed <code>9d26957e02<\/code>; its one finding asked to put <code>Errors.FolderNotWritable<\/code> back in the low-priority file, <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547#discussion_r4622033520\" target=\"_blank\" rel=\"noopener\">answered with your decision and resolved<\/a>; it has not seen <code>8541fed7cf<\/code>. CI (Bot PR dependencies, PR Automation): passed on <code>8541fed7cf<\/code>.","<b>Worth knowing.<\/b> Nobody has run this in a real Bloom against a denied or antivirus-protected folder; the tests cover how the failure is thrown and classified, not the dialogs. The PR description is still the Bloom bot's original text (a workflow restores it); the current summary is in <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8547#issuecomment-6989982070\" target=\"_blank\" rel=\"noopener\">a PR comment<\/a>, refreshed this run."],"questions":[{"title":"Should Bloom keep running when it can't make the Downloads collection?","context":["At startup Bloom makes the collection that downloaded books go into, under ProgramData, if it isn't there (<a href=\"https://github.com/BloomBooks/BloomDesktop/blob/8541fed7cf52d843632f5b9dd456e85ed27e17ab/src/BloomExe/WebLibraryIntegration/BookDownloadSupport.cs#L44\" target=\"_blank\" rel=\"noopener\">BookDownloadSupport.cs:44<\/a>). If Windows won't let it, Bloom now explains and then exits, as it always has. That happens before the user's own collection is even considered, so on a locked-down machine a user whose collection is perfectly writable can't start Bloom at all. The folder is only needed for downloads.","If the problem is permissions, the message also advises moving \"the collection\" to Documents, which doesn't fit a folder Bloom makes for itself. A <code>/simplify<\/code> reviewer raised this."],"options":[{"label":"Explain, then carry on without it","recommended":true,"why":"Recommended because downloads are one feature; the rest of Bloom works, and a download later would fail with its own error.","effort":"~5 lines here; check that a download with the folder missing fails clearly; low-moderate risk","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\bot-bl-16728-report-an-unwritable-collection-folder-an (BloomBooks/BloomDesktop, branch bot/bl-16728-report-an-unwritable-collection-folder-an, PR #8547), in src/BloomExe/WebLibraryIntegration/BookDownloadSupport.cs EnsureDownloadFolderExists, log the CollectionFolderNotWritableException instead of reporting it and calling Environment.Exit, and let startup continue. Then check what BookDownload does when its DownloadFolder is missing (BookDownload.cs DownloadFolder, OnDoDownload) and make a download in that state fail with a clear message rather than a crash. Run the related tests."},{"label":"Explain and carry on, showing the message","why":"Tells the user at startup, at the cost of a message on every start until someone fixes the machine.","effort":"~3 lines; low risk","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\bot-bl-16728-report-an-unwritable-collection-folder-an (branch bot/bl-16728-report-an-unwritable-collection-folder-an, PR #8547), in src/BloomExe/WebLibraryIntegration/BookDownloadSupport.cs EnsureDownloadFolderExists, keep DefenderFolderProtectionCheck.ReportProblem but remove the Environment.Exit so startup continues."}],"leaveAsIs":"Bloom explains and exits at startup when it can't make the Downloads collection, as it always has.","codeComment":true},{"title":"One message for \"Windows won't let Bloom change files here\"?","context":["You asked whether both messages are new in 6.6. Only partly:","<b>Old and translated<\/b> (Bloom.xlf, since 2017, ~80 translated files): <code>Errors.DefenderFolderProtectionHeading<\/code> \"This program cannot write to the folder {0}.\" and <code>Errors.DefenderFolderProtection<\/code> \"This might be caused by Windows Defender…\". This PR's modal still uses both.","<b>New, translate=\"no\"<\/b>: this PR's <code>Errors.FolderNotWritable<\/code> (the permission paragraph), and BL-17056's toast strings <code>Errors.FileAccessCheck.Blocked<\/code> \"Windows is not letting Bloom change files in this collection.\" and <code>Errors.FileAccessCheck.BlockedLonger<\/code> (the antivirus explanation with a help link, no path).","So one shared wording is possible: the new strings can still be renamed or reworded freely, but dropping the path from the modal means replacing the translated heading with a new string (the old one is marked obsolete), so that message loses its translations in 6.6 until translators catch up. Two other things to settle: the modal is a plain MessageBox, while the toast's longer text is HTML with a link, so either the modal moves to Bloom's HTML problem dialog or the shared antivirus paragraph comes in a plain-text form; and the permission paragraph's advice \"move the collection to … Documents\" is wrong when the failing folder is Documents itself (startup with no recent collection) or the Downloads collection."],"options":[{"label":"Unify now, in this PR","recommended":true,"why":"Recommended because the new strings haven't shipped, so now is the cheapest time; the modal and the toast would say the same thing, without a path.","effort":"moderate: ~4 strings reworked or added, 2 old ones marked obsolete, modal moved to the HTML problem dialog; moderate risk to the wording only","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\bot-bl-16728-report-an-unwritable-collection-folder-an (branch bot/bl-16728-report-an-unwritable-collection-folder-an, PR #8547), make DefenderFolderProtectionCheck.ReportProblem and FileAccessStartupCheck.ReportBlocked share one wording with no folder path: reuse Errors.FileAccessCheck.Blocked as the first line of both; split the antivirus explanation out of Errors.FileAccessCheck.BlockedLonger into a string both use, with the help link; keep Errors.FolderNotWritable for the permission case but word it so it fits Documents and the Downloads collection too. Show the modal through Bloom's HTML-capable problem dialog so the link works, log the folder path, and mark Errors.DefenderFolderProtectionHeading and Errors.DefenderFolderProtection obsolete per .claude/skills/xlf-strings/SKILL.md (after checking nothing else uses them). Propose the exact English wording to John before committing."},{"label":"Only drop the path, now","why":"Smallest step toward your preference; the two messages stay worded differently.","effort":"~1 new string, 1 marked obsolete; low risk","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\bot-bl-16728-report-an-unwritable-collection-folder-an (branch bot/bl-16728-report-an-unwritable-collection-folder-an, PR #8547), replace the modal's first line Errors.DefenderFolderProtectionHeading (which shows {0}) with a new translate=\"no\" string in Bloom.xlf that names no path (e.g. reuse the wording of Errors.FileAccessCheck.Blocked), keep the path in the log only, and mark Errors.DefenderFolderProtectionHeading obsolete per .claude/skills/xlf-strings/SKILL.md after checking nothing else uses it. Also fix Errors.FolderNotWritable's Documents advice for when the failing folder is Documents."},{"label":"Make a follow-up card","why":"Keeps this PR to the crash fix; the wording work gets its own review.","effort":"no code here; a YouTrack card","instruction":"Create a YouTrack card on the Bloom 6.6 board: 'One wording for \"Windows won't let Bloom change files here\"', covering DefenderFolderProtectionCheck.ReportProblem (modal, BL-16728) and FileAccessStartupCheck.ReportBlocked (toast, BL-17056): shared strings with no folder path (path only in the log), Errors.FolderNotWritable's Documents advice when the failing folder is Documents or the Downloads collection, and the old translated Errors.DefenderFolderProtection* strings to retire. Link it from BL-16728 and BL-17056."}],"leaveAsIs":"the modal keeps the 2017 heading with the folder path and the toast keeps its own wording."},{"title":"Next step","context":["What should happen once these are answered?"],"options":[{"label":"Do my choices, then re-run preflight","recommended":true,"why":"Recommended because any code change restarts the reviewers.","effort":"depends on the choices","instruction":"Carry out the decisions above on PR #8547 (branch bot/bl-16728-report-an-unwritable-collection-folder-an), then run /preflight again."},{"label":"Do my choices; I'll review before anything else","why":"For when you want to look at the code first.","effort":"depends on the choices","instruction":"Carry out the decisions above on PR #8547 (branch bot/bl-16728-report-an-unwritable-collection-folder-an), commit and push, and stop for my review without re-running preflight."}],"leaveAsIs":"nothing more happens until I say."}]}</script>

<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
