<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-19","about":"bloom-table PR 10 (branch table-pills-right) for BL-17024; BloomDesktop branch BL-17024-table-menu-affordances","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloom-table-table-pills-right.html","context":["<p><a href=\"https://github.com/BloomBooks/bloom-table/pull/10\" target=\"_blank\" rel=\"noopener\">PR #10<\/a> · <a href=\"https://github.com/BloomBooks/bloom-table/pull/10/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/bloom-table/pull/10/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17024\" target=\"_blank\" rel=\"noopener\">BL-17024<\/a> · <a href=\"https://devinreview.com/BloomBooks/bloom-table/pull/10\" target=\"_blank\" rel=\"noopener\">Devin<\/a> &nbsp; <!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"merged\">Merged<\/span><!-- pr-state:end --> · 5 decisions open (none block anything)<\/p>","<p><b>What this PR is about.<\/b> BL-17024: a table that fills an ebook page left its row menu pill off the left edge of Bloom’s page frame. Testing a table that fills an A5 page to all four edges found four problems, and review a fifth. (1) The row pill now sits to the right of the selected row, stepping past the add-column “+” when level with it. (2) The pills draw above a host’s fixed bar (Bloom’s Change Layout bar covered the column pill). (3) A row that runs past the page no longer puts the table pill, the “+” buttons or the row pill beside its hidden part: overlays are placed from the visible part of the table. (4) In a window smaller than the page, an invisible marker in the frame’s body lets it scroll to pills outside the page. (5) Beside a merged cell, the row and column pills centre on the selected line, not the whole merged cell.<\/p>","<p><b>Quality gate<\/b> (at 3dd22ac): typecheck clean · lint: none in this repo · unit tests (vitest) 628 passed · e2e (Playwright) 75 passed, 1 skipped, 1 failed: the Border Brush menu screenshot in border-scope.spec.ts, which fails on master too and you said to leave · C#: none in this repo · merged into master as 5acb513.<\/p>","<p><b>This run<\/b> opened PR 10 and added two fix commits: the pills are held inside the visible table (4f1ab16), and they centre on the selected line beside merged cells (3dd22ac).<\/p>","<p><b>Reviewers.<\/b> Local review (light sub-agent pass): 1 finding (pill anchored to a hidden skip cell under a span), fixed. Walkaround with /simplify: three passes, small cleanups applied, proposals below. Devin: complete at 3dd22ac; its bug and flag from the first round are fixed (<a href=\"https://github.com/BloomBooks/bloom-table/pull/10#discussion_r4635911103\" target=\"_blank\" rel=\"noopener\">bug<\/a>, <a href=\"https://github.com/BloomBooks/bloom-table/pull/10#discussion_r4635911302\" target=\"_blank\" rel=\"noopener\">flag<\/a>). Greptile: complete at 3dd22ac, no new issues; its two first-round findings are fixed (<a href=\"https://github.com/BloomBooks/bloom-table/pull/10#discussion_r4635813172\" target=\"_blank\" rel=\"noopener\">P1<\/a>, <a href=\"https://github.com/BloomBooks/bloom-table/pull/10#discussion_r4635813179\" target=\"_blank\" rel=\"noopener\">P2<\/a>). CI: none on bloom-table.<\/p>","<p><b>Worth knowing.<\/b> Nothing on the committed code was checked in a running Bloom; fixes (1) to (4) were seen working there before the final two commits. bloom-table has no tracker, so no test ideas were posted; BloomDesktop’s preflight will post them on BL-17024.<\/p>"],"questions":[{"title":"Place the row and column pills with JS instead of CSS anchor()?","context":["<p>The row and column pills are positioned with CSS <code>anchor()<\/code> on a cell; the table pill and the \"+\" buttons are placed by JS from measured rectangles. This PR now clamps the anchored pills to the visible table with px limits measured in JS, so the two methods are mixed. Two reviewers proposed placing the row and column pills with JS like the other overlays (and, going further, making all overlays <code>position: absolute<\/code> so the invisible scroll marker would not be needed).<\/p>","<p>What <code>anchor()<\/code> still buys: when a row grows while someone types, the pill follows it at once. Nothing in bloom-table repositions the overlays on typing, so JS-placed pills would lag until the next scroll, resize or table operation (the \"+\" buttons already behave that way). What it costs: when a page that hides its overflow is scrolled by code after the pills were placed (for example by focusing a tall cell), Chrome shifts the anchored pill without re-applying the clamp, so it can drift beside the hidden part until the next reposition.<\/p>"],"options":[{"label":"Place the row and column pills with JS, and repaint on typing","why":"One positioning method for every overlay, no clamp drift, and the jsdom tests could check real positions.","effort":"~40 lines in src/table-size-buttons.ts plus an input/ResizeObserver hook to reposition when a cell grows; moderate risk","instruction":"In D:/bloom-table.worktrees/BL-17024 (BloomBooks/bloom-table, branch table-pills-right, PR 10), stop using position-anchor/anchor() for the row and column pill clusters in applyAnchorPositioning (src/table-size-buttons.ts); place them with placePill from the edge and centre cells' rects clamped to visibleCellBounds, and add a reposition when a cell's size changes (input event or a ResizeObserver on the table's cells) so the pills follow a row that grows while typing. Update tests/e2e/pills-reachable.spec.ts and pills-merged-cells.spec.ts as needed."},{"label":"Also make every overlay position: absolute and drop the scroll marker","why":"Absolutely placed overlays make the document scroll to them on their own, so the invisible marker in body goes away.","effort":"larger: every overlay's placement and the proximity gate's hiding (display:none would shrink the document) change; moderate-to-high risk","instruction":"In D:/bloom-table.worktrees/BL-17024 (BloomBooks/bloom-table, branch table-pills-right), change the ProximityDiv-wrapped overlays to position: absolute in document coordinates (placePill adds window.scrollX/Y), place the row and column clusters from JS too, hide pills with visibility/opacity rather than display:none so the scroll room stays, and remove the scroll-room marker (placeScrollRoomMarker) and its tests."}],"leaveAsIs":"the row and column pills keep CSS anchor() with JS-measured clamps; the scroll marker stays.","leaveAsIsRecommended":"Recommended: anchor() is what keeps the pills beside a row that grows while you type, and the drift needs a page scrolled by code after the pills were placed. Revisit if the drift shows up in Bloom.","codeComment":true},{"title":"Give the column \"+\" its own spot instead of moving the row pill past it?","context":["<p>With the row pill now on the right, it shares the table's right side with the add-column \"+\", which sits at the middle of the right edge. When the selected row is level with the \"+\", the row pill moves further right, past it (<code>rowClusterOffsetPastColumnAdd<\/code>). That is a hand-written rule for one pair of overlays.<\/p>","<p>An alternative is to move the add-column \"+\" to the top-right corner, level with the column pill, so the two never meet and the rule goes. That changes where a user finds the add-column button.<\/p>"],"options":[{"label":"Move the add-column \"+\" to the top-right corner","why":"No overlap rule; each control has its own place.","effort":"~15 lines, removes rowClusterOffsetPastColumnAdd and its tests; changes what users see","instruction":"In D:/bloom-table.worktrees/BL-17024 (BloomBooks/bloom-table, branch table-pills-right), place the add-column \"+\" (colAddBtn, via placePill in applyAnchorPositioning, src/table-size-buttons.ts) at the table's top-right corner instead of the middle of its right edge, remove rowClusterOffsetPastColumnAdd and its tests in src/row-pill-placement.test.ts, and update the screenshots in the PR description."}],"leaveAsIs":"the add-column \"+\" stays at the middle of the right edge and the row pill steps past it when level.","leaveAsIsRecommended":"Recommended unless you prefer the \"+\" in the corner: the current layout works and a user already knows where the \"+\" is.","codeComment":false},{"title":"Handle staggered merges when centring the pills?","context":["<p>Each pill now centres on a cell that covers the selected row (column) alone. If no such cell exists, as in a staggered merge (column A spans rows 1-2 and column B spans rows 2-3, and row 2 is selected), the pill falls back to centring on the edge cell, so it sits between rows. A more general version centres on the row's top and bottom edges taken from two different cells.<\/p>"],"options":[{"label":"Centre on the line's two edges","why":"Covers staggered merges too.","effort":"~10 lines in applyAnchorPositioning plus an e2e case; low risk","instruction":"In D:/bloom-table.worktrees/BL-17024 (BloomBooks/bloom-table, branch table-pills-right), in applyAnchorPositioning (src/table-size-buttons.ts), centre the row pill between the selected row's top edge (the selected cell's top) and its bottom edge (a cover ending at that row, or the top of a cell starting at the next row), using two named anchors in calc((anchor(--a top) + anchor(--b bottom)) / 2); same for the column pill with left/right; make the rowClusterOffsetPastColumnAdd midline use the same two edges; add a staggered-merge case to tests/e2e/pills-merged-cells.spec.ts and fixtures/merged-cells.html."}],"leaveAsIs":"a pill on a row with only staggered merges centres on the edge cell.","leaveAsIsRecommended":"Recommended: staggered merges along the selected line are rare in Bloom tables.","codeComment":true},{"title":"Measure the cost of the new clipping check on slow machines?","context":["<p><code>visibleCellBounds<\/code> now reads the computed style of each ancestor of the table, up to <code>body<\/code>, every time it runs. It runs once per animation frame of mouse movement for every table on the page (the check that decides whether the pills show), and on every mouse move during a column or row resize drag. A Bloom page is perhaps 10 to 20 levels deep. Nothing was measured.<\/p>"],"options":[{"label":"Measure it on a slow machine first","why":"Tells us whether caching is worth its extra state.","effort":"no code: a performance trace of mouse movement over a page with several tables in Bloom's production build","instruction":"Measure in Bloom's production build, with bloom-table from branch table-pills-right (BloomBooks/bloom-table PR 10) linked, the time spent in visibleCellBounds during continuous mouse movement over a page holding several tables, on a slow machine or with CPU throttling, and report the numbers before changing anything."},{"label":"Cache the clipping ancestors per table now","why":"Removes the per-frame style reads without measuring.","effort":"~20 lines: a WeakMap of each table's clipping ancestors, cleared on reset and on structure changes; adds state that can go stale","instruction":"In D:/bloom-table.worktrees/BL-17024 (BloomBooks/bloom-table, branch table-pills-right), cache each table's list of overflow-clipping ancestors (src/resize-boundary-highlight.ts, visibleCellBounds) in a WeakMap filled on first use and cleared in resetTableSizeButtons and when a table is attached or its host changes, so each call reads only the clip rects."}],"leaveAsIs":"visibleCellBounds walks the ancestors on every call.","codeComment":false},{"title":"Next step","context":["<p>PR 10 is merged. Bloom only gets these changes after a bloom-table release builds a new dist tag (the newest is dist-v0.1.6) and BloomDesktop branch BL-17024-table-menu-affordances bumps <code>bloom-table<\/code> in <code>src/BloomBrowserUI/package.json<\/code> from dist-v0.1.5. That branch holds only a papercut and the two temporary files that link a local bloom-table build.<\/p>"],"options":[{"label":"Release bloom-table, then bump BloomDesktop and preflight it","recommended":true,"why":"Recommended because Bloom is where the problem on BL-17024 shows.","effort":"run the Release action, a one-line bump, a check in Bloom and a BloomDesktop preflight","instruction":"Run BloomBooks/bloom-table one-click Release action on master (5acb513) to build the next dist tag; then in D:/bloom/BL-17024-table-menu-affordances revert src/BloomBrowserUI/pnpm-workspace.yaml and pnpm-lock.yaml (the local link), bump bloom-table in src/BloomBrowserUI/package.json to the new dist tag, check the worst-case table page in the running Bloom, and run /preflight on that branch."},{"label":"Stop here","why":"Nothing more happens until you say.","effort":"none","instruction":"Stop here; do not release bloom-table or touch BloomDesktop yet."}],"leaveAsIs":"nothing further is done now.","codeComment":false}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
