<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-12","about":"Preflight report for BloomDesktop branch BL-17108-localize-table-ui (PR 8561) and bloom-table dist-v0.1.3","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bl-17108-localize-table-ui.html","context":["<b>Purpose.<\/b> A user running Bloom in another UI language met English all over a table: the pills and + buttons, the Row, Column, Table and Cell menus with their Format, Size and border controls, and the Paint format badge. All of it comes from the bloom-table library, which had no way for Bloom to translate it. The Publish tab's subscription notice also named the Table feature in English, because <code>Feature.Table<\/code> had no XLF entry.","<b>What the PR does.<\/b> It pins bloom-table <code>dist-v0.1.3<\/code>, which sends every string in its own UI through a localizer that the host installs. <code>tableUiLocalization.ts<\/code> preloads all 89 ids as <code>EditTab.Table.&lt;id&gt;<\/code> when a page's tables are set up, then installs a localizer that answers from that dictionary and relabels the pills and + buttons that already exist. The XLF entries went to master on their own in cbf5b1603b, and Crowdin has them with French, Spanish, Portuguese and Indonesian suggestions and 31 tagged screenshots. Two tests: every library string has its English XLF entry, and the preload and localizer are wired up.","<b>Quality gate.<\/b> TypeScript typecheck: passed. ESLint: passed. Vitest, the tests related to the change: 10 passed (<code>tableUiLocalization.test.ts<\/code>, <code>tableEditing*.test.ts<\/code>). C# tests: not run, because there is no C# in the diff. E2E: not run, because no spec is in the diff and the UI reads the same in English. Merge with master: clean.","<b>This run.<\/b> Committed the Bloom side, merged master, opened the draft PR, and added the test that Devin asked for (<a href=\"https://github.com/BloomBooks/BloomDesktop/commit/4ee0adc0ca\" target=\"_blank\" rel=\"noopener\">4ee0adc0ca<\/a>).","<b>Reviewers.<\/b> Local review (light sub-agent pass): clean, no findings. Walkaround: updated a stale paragraph in the plan doc; no proposals for the Bloom side. Devin: complete; it raised one Investigate flag (no test of the localizer install), fixed and <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8561#discussion_r4545407654\" target=\"_blank\" rel=\"noopener\">resolved<\/a>; its re-review of the fix repeated the same flag, which the fix already answers. Greptile: complete on 96e753a697, with no actionable issues; it has not reviewed the test-only commit after it. CI: pr-automation passed.","<b>Worth knowing.<\/b> Nobody has seen a translated table menu yet: Bloom's translated XLF files will only have these strings after the Crowdin suggestions are approved and merged back. bloom-table's own walkaround and review already ran before its release; that work is on bloom-table master as 6a4d145."],"questions":[{"title":"Pills and + buttons stay hidden when the pointer is already over a table as the page opens","context":["While capturing screenshots in a running Bloom, the agent saw that right after a page loaded, the round buttons and + buttons around a table did not appear even though the pointer was over the table. Moving the pointer away and back made them appear.","Its guess: the library decides whether to show them when the pointer first comes near the table, and Bloom's answer to \"may this table be restructured?\" (which needs a request to Bloom) arrives later, so the first answer is \"no\". Nobody has checked whether this happens on master too; this PR does not touch that code."],"options":[{"label":"Fix it now","recommended":true,"why":"Recommended because a user who opens a page with the pointer over a table sees no way to change it until they wiggle the mouse, and the cause is likely small.","effort":"probably ~10-20 lines in Bloom's tableFeature.ts or a library re-show; needs a repro first","instruction":"In D:\\bloom\\BL-17108-localize-table-ui (BloomDesktop, branch BL-17108-localize-table-ui), reproduce: open a page with a table with the pointer already over it, and see whether the bloom-table pills and + buttons fail to show until the pointer leaves and returns. Check master too. If confirmed, make the chrome re-evaluate once refreshTableFeatureStatus() (bookEdit/js/tableFeature.ts) resolves, so the pills appear without moving the pointer; add a test."},{"label":"File a card","effort":"no code now","instruction":"Create a YouTrack card on the Bloom 6.6 board: right after a page opens with the pointer already over a table, the table's pills and + buttons stay hidden until the pointer leaves and returns; suspected cause is that bloom-table's structural chrome gate answers false before Bloom's table feature status arrives. Link it from BL-17108."}],"leaveAsIs":"the pills may stay hidden until the pointer moves, right after a page opens.","codeComment":false},{"title":"Remove the CellMenuItems component's own localize prop in bloom-table?","context":["bloom-table now has one global localizer that every string goes through. Its React <code>CellMenuItems<\/code> component still also takes its own <code>localize<\/code> prop, which overrides the global one for that component only. Nothing in Bloom uses that component, and no host passes the prop.","The walkaround's reviewer suggested removing the prop, so a host's own menu could never word the cell items differently from the library's right-click popup. Removing it means changing two existing tests in <code>CellMenuItems.test.tsx<\/code> again (to install the global localizer instead of passing the prop) and another library release."],"options":[{"label":"Remove the prop","effort":"~20 lines in bloom-table, 2 test edits, a patch release and a Bloom pin bump","instruction":"In bloom-table (make a worktree from master), remove the localize prop from CellMenuItems (src/components/CellMenuItems.tsx) so it always uses the localizer installed with setTableLocalizer; change the two tests in CellMenuItems.test.tsx that pass localize to install a localizer with setTableLocalizer instead (approved); update the README paragraph; run the unit tests, push to master, run the Release workflow (patch) and pin Bloom to the new tag."}],"leaveAsIs":"CellMenuItems keeps an optional localize prop that overrides the global localizer.","leaveAsIsRecommended":"Recommended because no host uses the prop, so it causes no inconsistency today, and removing it costs a library release and two test changes for no visible gain.","codeComment":false},{"title":"Next step","context":["The PR is a draft with every reviewer finished and nothing failing."],"options":[{"label":"Do my picks above, then preflight again","recommended":true,"why":"Recommended because the first question's fix would change the PR.","effort":"depends on the answers","instruction":"Carry out the answers above on BL-17108-localize-table-ui, then run preflight again."},{"label":"Discuss first","effort":"none","instruction":"Stop and discuss the answers above before changing anything."}],"leaveAsIs":"nothing more is done for now."}]}</script>
</head>
<body>
<main>
<header style="margin:0 0 18px;font-family:system-ui,sans-serif;font-size:14px">
<div style="font-family:Georgia,serif;font-size:22px;margin-bottom:6px">Preflight: translate the table menus (BL-17108)</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
<!-- pr-state:begin --><span class="chip" data-pr-state="draft" style="border:1px solid #ccc;border-radius:12px;padding:2px 10px">Draft PR</span><!-- pr-state:end -->
<span style="border:1px solid #ccc;border-radius:12px;padding:2px 10px">Mergeable</span>
<span style="border:1px solid #ccc;border-radius:12px;padding:2px 10px">Bots quiet</span>
<span style="border:1px solid #ccc;border-radius:12px;padding:2px 10px">2 questions waiting</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:14px">
<a href="https://github.com/BloomBooks/BloomDesktop/pull/8561" target="_blank" rel="noopener">PR #8561</a> <a href="https://github.com/BloomBooks/BloomDesktop/pull/8561/files" target="_blank" rel="noopener">Files changed</a> <a href="https://github.com/BloomBooks/BloomDesktop/pull/8561/commits" target="_blank" rel="noopener">Commits</a>
<a href="https://issues.bloomlibrary.org/youtrack/issue/BL-17108" target="_blank" rel="noopener">BL-17108</a>
<a href="https://devinreview.com/BloomBooks/BloomDesktop/pull/8561" target="_blank" rel="noopener">Devin review</a>
<a href="https://github.com/BloomBooks/bloom-table/commit/6a4d145" target="_blank" rel="noopener">bloom-table 6a4d145</a>
</div></header>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
