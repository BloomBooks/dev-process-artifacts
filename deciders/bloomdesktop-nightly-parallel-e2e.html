<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-18","about":"Preflight report — BloomBooks/BloomDesktop PR #8590, branch nightly-parallel-e2e (worktree C:\\dev\\_worktrees\\BloomDesktop\\ask)","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-nightly-parallel-e2e.html","context":["<b>Preflight report: run the nightly's BloomE2E suite in three parallel shards<\/b> — PR is clean; the nightly on the branch passed in 35 minutes; 1 decision waits on you.","<!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Merged<\/span><!-- pr-state:end --> · mergeable · bots quiet · 1 decision","<a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590\" target=\"_blank\" rel=\"noopener\">PR #8590<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8590\" target=\"_blank\" rel=\"noopener\">Devin review<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/actions/runs/44342294290\" target=\"_blank\" rel=\"noopener\">Nightly run on this branch<\/a> · no YouTrack card","<b>Purpose.<\/b> The BloomE2E suite has grown to 82 minutes. On 2026-11-18 it pushed the nightly past its 120-minute job timeout: visual regression was cut off and no Slack report was posted. BloomE2E runs one Bloom at a time, so the only way to run it in parallel is on separate machines. This PR runs it in three shards, each on its own runner, alongside the rest of the nightly.","<b>What the PR does.<\/b> <code>build-and-test<\/code> keeps every suite except BloomE2E and uploads its results. A new <code>e2e<\/code> matrix job runs <code>playwright test --shard=N/3<\/code> on three runners, each doing its own setup and builds. A new <code>report<\/code> job publishes all five suites' checks from the uploaded results. It writes a failing stand-in for any shard that left no results, and finds the shards across every attempt. It then posts the Slack report, whose headline says \"passed\" only when no suite line, and no step of the report job itself, failed. The C# build, with a new NuGet cache, moves into a shared <code>.github/actions/bloom-build<\/code> action used by the shards, <code>bot-verify<\/code>, <code>culture-sweep<\/code> and <code>harvester-artifacts<\/code>. <code>build-and-test<\/code> keeps its own copy, plus the cache, because its C# build runs even after an earlier failure. The nightly-triage skill and the BloomE2E README give the new artifact names.","<b>The nightly on the branch.<\/b> <a href=\"https://github.com/BloomBooks/BloomDesktop/actions/runs/44342294290\" target=\"_blank\" rel=\"noopener\">Run 44342294290<\/a>, on <code>f49d738<\/code>, passed: every job and every check. The night took <b>35m 23s<\/b>, against BloomE2E's 82 minutes alone this morning. The shards took 25, 31 and 35 minutes, each including about 6 minutes of setup and builds; <code>build-and-test<\/code> took 32 minutes; the report job under a minute. The BloomE2E check counted all 299 tests from the three shards. Slack posting was off for the dispatch. The report script, replayed on that run's real results and jobs, gives:<br><code>✅ Nightly run passed · 35m 23s<\/code> — TypeScript 1773 passed (4m 0s), C# 4120 passed (12m 36s), BloomE2E 299 passed (27m 43s), React component 146 passed (2m 53s), visual regression 12 passed (3m 32s); \"BloomE2E ran in 3 parallel jobs; the slowest took 34m 44s, its own setup and builds included.\" The slow-steps report now prints in each shard's log.","<b>Quality gate.<\/b> TypeScript and C# typecheck, lint and tests: not run — no TypeScript or C# in the diff. Workflow and action YAML: parse; the commit hook's formatter passed. The report and stand-in scripts parse, and were replayed against real data and faked shard jobs for pass, a failing shard, a missing shard, results that never arrived, a renamed shard job, a failed results download, all suites unticked, and a failed step of the report job. E2E repo check: did not apply — no spec files changed. Merge: up to date with master, mergeable. Test of the change: none — your decision: CI configuration, tested by running the nightly on the branch.","<b>What changed this run.<\/b> Carried out your decisions: all five publish steps moved into the report job, a shared <code>bloom-build<\/code> action with a NuGet cache, and the test decision recorded. Then fixed the two report-job gaps Devin and Greptile found in that change. See the <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590/commits\" target=\"_blank\" rel=\"noopener\">commits<\/a>.","<b>Reviewers.<\/b> Local review (light sub-agent pass): clean. Walkaround: <code>/simplify<\/code> ran on the new changes; it made 9 behavior-preserving tidies and no proposals. One small fix after it did not need another pass. Devin: complete on <code>a13df70<\/code>. Its two new findings this run (<a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590#discussion_r4617418540\" target=\"_blank\" rel=\"noopener\">missing results left the run green<\/a>, <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590#discussion_r4617419712\" target=\"_blank\" rel=\"noopener\">report-job failures left Slack saying passed<\/a>) are fixed, and Devin marks all four of its findings resolved. Greptile: complete on <code>a9c7165<\/code>; its one finding, the same gap, is fixed and <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8590#discussion_r4617423813\" target=\"_blank\" rel=\"noopener\">resolved<\/a>, and the commit since only answers it. CI: <code>pr-automation<\/code> passed.","<b>Worth knowing.<\/b> The nightly that passed ran <code>f49d738<\/code>, before this run's changes: the publish steps in the report job, the build action and its cache, and the report job's own status line have only been replayed locally. <code>bot-verify<\/code>, <code>culture-sweep<\/code> and <code>harvester-artifacts<\/code> have not yet run with the build action; their msbuild commands are unchanged, and only the cache around them is new."],"questions":[{"title":"Prove the latest changes on GitHub before review?","context":["The nightly that passed (run 44342294290) tested the commit before this run's changes. Since then, all five suites publish from the report job, a shared build action with a NuGet cache builds Bloom for the shards and three other workflows, and the report reads its own job's status. All of that parses and was replayed locally, but none of it has run on GitHub. A second nightly on the current commit would prove the nightly's part in about 35 minutes. A small <code>bot-verify<\/code> run, one short e2e spec, would prove the build action through a second caller in about 15 minutes. <code>culture-sweep<\/code> and <code>harvester-artifacts<\/code> are left to their next natural runs."],"options":[{"label":"Dispatch a nightly and a small bot-verify run on the branch, without Slack","recommended":true,"why":"Recommended because these are the only way to test the changes, they cost only free runner minutes, and they post nothing to Slack.","effort":"no code; ~35 minutes of waiting","instruction":"On BloomBooks/BloomDesktop, dispatch nightly.yml on branch nightly-parallel-e2e with default inputs (post_report off), and bot-verify.yml on the same branch with e2e_specs='booklet-print-instructions.spec.ts' and repeat=1; watch both to the end, report how each job and check came out (and the report text, by replaying the compose script on the nightly's results), and fix anything they show."},{"label":"Dispatch only the nightly","effort":"no code; ~35 minutes","instruction":"On BloomBooks/BloomDesktop, dispatch nightly.yml on branch nightly-parallel-e2e with default inputs (post_report off); watch it to the end and report how each job and check came out, fixing anything it shows."},{"label":"Dispatch the nightly with Slack posting on","effort":"no code; posts one message to #bloom-team-developers","instruction":"On BloomBooks/BloomDesktop, dispatch nightly.yml on branch nightly-parallel-e2e with post_report ticked; watch it to the end and report how each job came out and what it posted to Slack."}],"leaveAsIs":"the changes since run 44342294290 are first run on GitHub by the scheduled nightly after merge."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
