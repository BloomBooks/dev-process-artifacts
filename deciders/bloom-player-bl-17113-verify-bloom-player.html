<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-19","about":"Preflight report: BloomBooks/bloom-player PR #447, branch BL-17113-Verify-bloom-player (BL-17113), base alpha, head 6eb7d7e","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloom-player-bl-17113-verify-bloom-player.html","context":["<p>This is the third preflight run on PR #447. The branch is now rebased onto <b>alpha<\/b>, as one main commit plus the <code>.eslintrc.js<\/code> removal. The gates are green, Devin found nothing, and the PR is still a draft. Two items are open.<\/p>","<p><!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\"><a href=\"https://github.com/BloomBooks/bloom-player/pull/447\" target=\"_blank\" rel=\"noopener\">Draft PR<\/a><\/span><!-- pr-state:end --> · Mergeable, up to date with alpha · Bots quiet · 2 items open<\/p>","<p><a href=\"https://github.com/BloomBooks/bloom-player/pull/447\" target=\"_blank\" rel=\"noopener\">PR #447<\/a> · <a href=\"https://github.com/BloomBooks/bloom-player/pull/447/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/bloom-player/pull/447/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17113\" target=\"_blank\" rel=\"noopener\">BL-17113<\/a> · <a href=\"https://devinreview.com/BloomBooks/bloom-player/pull/447\" target=\"_blank\" rel=\"noopener\">Devin review<\/a> · <a href=\"https://reviewable.io/reviews/bloombooks/bloom-player/447\" target=\"_blank\" rel=\"noopener\">Reviewable<\/a><\/p>","<h3>(1/2) Older Android WebViews hang on \"Loading Bloom Player...\"<\/h3><p><b>Problem.<\/b> Bloom Reader warns about an outdated WebView only when it is older than Chrome 54. But the player actually needed Chrome 80, so on a WebView from 54 through 79 there was no warning and the player hung on \"Loading Bloom Player...\".<\/p><p><b>Cause.<\/b> There was no explicit <code>build.target<\/code>, so Vite 7 left <code>??<\/code> and <code>?.<\/code> in the bundle. Chromium 79 fails with <code>SyntaxError: Unexpected token '?'<\/code>; Chromium 80 works.<\/p><p><b>What the PR does.<\/b><\/p><ul><li><code>\"browserslist\": [\"chrome 54\"]<\/code> in <code>package.json<\/code> is now the one place the floor is set.<\/li><li><a href=\"https://github.com/BloomBooks/bloom-player/blob/6eb7d7e51cfa6497ef89f22e975435d8521471dc/vite.config.ts#L7-L15\" target=\"_blank\" rel=\"noopener\">vite.config.ts<\/a> builds the player and the shared lib for it. This lowers syntax only and adds no polyfills.<\/li><li><a href=\"https://github.com/BloomBooks/bloom-player/blob/6eb7d7e51cfa6497ef89f22e975435d8521471dc/eslint.config.js\" target=\"_blank\" rel=\"noopener\">eslint.config.js<\/a> runs <code>eslint-plugin-compat<\/code> over the built bundle, parsed as ES2016. <a href=\"https://github.com/BloomBooks/bloom-player/blob/6eb7d7e51cfa6497ef89f22e975435d8521471dc/e2e/bundle-browser-support.spec.ts\" target=\"_blank\" rel=\"noopener\">e2e/bundle-browser-support.spec.ts<\/a> runs it with the e2e suite, and <code>pnpm lint:browser-support<\/code> runs it on its own.<\/li><li>Verified by hand in Chromium 54.0.2840, 80 and 149: all 8 test books load and page through with no errors.<\/li><\/ul>","<h3>(2/2) A book's own activity script failed to load<\/h3><p><b>Problem.<\/b> This is an existing problem, unrelated to (1), found while testing it. An activity script in a book's folder was requested from <code>http://host/http://host/.../snake.js<\/code> and returned 404. The two test books that ship such a script were also written for the old <code>start()<\/code> interface.<\/p><p><b>What the PR does.<\/b> <a href=\"https://github.com/BloomBooks/bloom-player/blob/6eb7d7e51cfa6497ef89f22e975435d8521471dc/src/activities/loadDynamically.js#L8-L19\" target=\"_blank\" rel=\"noopener\">loadDynamically<\/a> resolves the script's url against the document, like the book's other files. Both fixtures now use <code>initializePageHtml<\/code>/<code>showingPage<\/code>, and neither depends on <code>initializePageHtml<\/code>, which the player skips for a book-folder script that hasn't arrived when the book is built. A unit test and two e2e tests cover it. One fails with a 404 on the old code. The other holds the script back until the book is showing, and fails on the earlier fixture. A Reviewable info comment flags this commit as unrelated.<\/p>","<h3>Quality gate<\/h3><table><tr><td>Typecheck (tsc)<\/td><td>pass<\/td><\/tr><tr><td>Lint (<code>lint:browser-support<\/code>, built bundle)<\/td><td>pass, 0 findings<\/td><\/tr><tr><td>TypeScript unit tests (vitest)<\/td><td><span class=\"numeral\">177 passed<\/span><\/td><\/tr><tr><td>E2E (Playwright, current Chromium, chrome54 build)<\/td><td><span class=\"numeral\">27 passed<\/span><\/td><\/tr><tr><td>Merge with master<\/td><td>rebased onto alpha, up to date<\/td><\/tr><tr><td>Other stacks<\/td><td>N/A: none in this repo<\/td><\/tr><\/table>","<h3>What changed this run<\/h3><ul><li>Rebased onto alpha as you asked, and retargeted the PR to alpha.<\/li><li>Removed the legacy <code>.eslintrc.js<\/code> (<a href=\"https://github.com/BloomBooks/bloom-player/commit/6eb7d7e51cfa6497ef89f22e975435d8521471dc\" target=\"_blank\" rel=\"noopener\">6eb7d7e<\/a>).<\/li><li>The local review caught a real timing bug in the widget test fixture as rewritten earlier in this PR: with a slow script, the page had no buttons and threw. It is fixed and folded into <a href=\"https://github.com/BloomBooks/bloom-player/commit/b51bf4a\" target=\"_blank\" rel=\"noopener\">b51bf4a<\/a>, with a test that forces the slow case.<\/li><\/ul>","<h3>Reviewer outcomes<\/h3><table><tr><td>Local review (light sub-agent pass)<\/td><td>1 finding (the widget fixture timing bug), fixed<\/td><\/tr><tr><td>Walkaround<\/td><td>3 changes: the slow-script test now holds the script until the book shows instead of waiting a fixed 1.5 s; it clicks Next directly; one clarifying comment. /simplify ran. 1 proposal, below.<\/td><\/tr><tr><td>Devin<\/td><td>complete on 6eb7d7e: 0 bugs, 0 flags<\/td><\/tr><tr><td>Other review bots<\/td><td>none on this repo<\/td><\/tr><tr><td>CI<\/td><td>no PR workflows in this repo<\/td><\/tr><\/table>","<h3>Worth knowing<\/h3><ul><li>The API check is weaker than it looks. On minified code <code>eslint-plugin-compat<\/code> skips calls under any <code>if<\/code>, and it can't see methods called on existing objects (e.g. <code>.at()<\/code> on an array). The syntax check has no such gap.<\/li><li>The new check covers the player bundle, not <code>lib/shared.es.js<\/code>, which is also built for Chrome 54.<\/li><li>Nobody has run this on a real Android device or emulator yet. The BloomReader worktree for this card is attempting an emulator test.<\/li><\/ul>"],"questions":[{"title":"Add a Chromium 54 smoke script and a repo Preflight check?","context":["<p>You asked whether agent guidance would be enough, and whether a repo can add its own steps to preflight. It can: preflight reads a <b>Preflight checks<\/b> heading in the repo's root <code>AGENTS.md<\/code>. Each check says when it applies (a condition on the diff), what to run, and what passing means. Preflight runs it every time and reports it. bloom-player has none yet.<\/p>","<p>Guidance alone has two gaps. Changes that don't come through an agent (bot dependency bumps, quick hand edits) skip it. And the agent would have to rebuild the old-Chromium tooling each time. A small script plus a Preflight check that runs it closes the second gap and covers every agent-made change. Bot bumps still get the cheaper lint check that runs with e2e.<\/p>"],"options":[{"label":"Add both in this PR","why":"Gets the strongest guard in place now; this PR is already about the Chrome 54 floor.","effort":"~150 lines: a node script, a package.json entry, and an AGENTS.md section; low risk, nothing runs in CI","instruction":"In C:\\dev\\_worktrees\\bloom-player\\BL-17113-Verify-bloom-player (branch BL-17113-Verify-bloom-player, PR #447, base alpha): add scripts/old-chromium-smoke.mjs and a `test:old-chromium` package.json entry. It downloads and caches the Chromium snapshot matching browserslist (Win_x64 snapshot 414589 for Chrome 54), serves dist + public/testBooks via e2e/server.mjs, and drives each test book over CDP with an Android WebView user agent, paging through and failing on page errors. Then add a 'Preflight checks' section to AGENTS.md that runs it after build:standalone whenever the diff touches src/, package.json dependencies, pnpm-lock.yaml or vite.config.ts; passing means no page errors in any test book. Squash it into the main commit (b51bf4a), keeping the chore commit separate, and re-run /preflight."},{"label":"Make it a follow-up card","recommended":true,"why":"Recommended because it is new tooling with its own testing, and this PR already has a guard that runs on every e2e run.","effort":"no code now; one YouTrack card","instruction":"Create a YouTrack card on the Bloom 6.6 board: 'bloom-player: Chromium 54 smoke script + AGENTS.md Preflight check' (a cached Chromium snapshot matching browserslist, test books driven over CDP with an Android WebView user agent, failing on page errors; run by a Preflight checks entry in AGENTS.md when the diff touches src/, dependencies or vite.config.ts; not in CI). Link it from BL-17113."}],"leaveAsIs":"Chrome 54 support stays guarded by the syntax and API checks in e2e, plus the one-time manual run."},{"title":"Card the player gap with late-loading book-folder activities?","context":["<p>The altitude review found that when a book-folder activity's page is shown before its script has arrived (e.g. it is the start page on a slow connection), the player doesn't start the activity on that visit, apart from a <code>console.assert<\/code>. It also skips that activity's <code>initializePageHtml<\/code> whenever the script isn't loaded when the book is built. The fixtures in this PR now avoid depending on it. Every activity Bloom ships is built in. The book-folder path appears to be used only by the BL-9871 test widget, so real books are not affected today.<\/p>"],"options":[{"label":"Create a low-priority card","recommended":true,"why":"Recommended because it's a real gap, but outside this card, and nothing shipping hits it.","effort":"no code now; one YouTrack card","instruction":"Create a low-priority YouTrack card on the Bloom 6.6 board: 'bloom-player: book-folder activities — initializePageHtml is skipped when the script loads after the book is built (async loadDynamically vs the synchronous page build in finishUp), and showingPage silently skips the activity if its script hasn't arrived'. Mention that all shipped activities are built in, and link BL-17113."}],"leaveAsIs":"the gap is known only from this PR's review; no card is made."},{"title":"Next step","context":["<p>What should happen after these answers?<\/p>"],"options":[{"label":"Do my picks; re-run preflight only if code changed","recommended":true,"why":"Recommended because cards need no re-run.","effort":"small","instruction":"Carry out the chosen options above for BL-17113 / PR #447; re-run /preflight only if code changed."},{"label":"Discuss first","why":"Talk it through before anything changes.","effort":"none","instruction":"Make no changes yet; discuss the answers with me first."}],"leaveAsIs":"the PR stays as it is, in draft."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
