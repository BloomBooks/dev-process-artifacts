<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-10","about":"Preflight report for BloomBooks/BloomDesktop PR #8529, branch BL-16773-cli-import-audio (card BL-16773), at d9280022aa","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bl-16773-cli-import-audio.html","context":["<p><a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8529\" target=\"_blank\" rel=\"noopener\">PR #8529<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8529/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8529/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-16773\" target=\"_blank\" rel=\"noopener\">BL-16773<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8529\" target=\"_blank\" rel=\"noopener\">Devin<\/a> · <a href=\"https://reviewable.io/reviews/BloomBooks/BloomDesktop/8529\" target=\"_blank\" rel=\"noopener\">Reviewable<\/a><br><!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"ready\">Ready for review<\/span><!-- pr-state:end --> · mergeable · bots quiet · 2 items for you<\/p>","<p><b>What this PR is about.<\/b> Testing BL-16773 found that importing a spreadsheet with audio hung from the command line, and that bad command-line arguments crashed with stack traces. Andrew suggested dropping the command-line import, since nobody is known to use it, and John agreed. The PR now does three things:<\/p>","<p><b>1. Retires <code>spreadsheetImport<\/code>.<\/b> The verb is commented out, not deleted, in its best (audio-working) version, along with its tests. The header of <code>SpreadsheetImportCommand.cs<\/code> lists what to uncomment. In-app import is unaffected.<\/p>","<p><b>2. Makes the in-app import safer on failure.<\/b> Import clears the book's audio folder before importing. If the import now fails before it saves the book, the old recordings are restored from the backup. The hidden helper browser is always disposed, and an import whose helper page never loads stops after 20 s instead of hanging. Tested by the new <code>SpreadsheetImportWithBackupTests<\/code>.<\/p>","<p><b>3. sendFontAnalytics argument checks.<\/b> It accepts the book's <code>.htm<\/code> path, and reports a missing folder or collection in one line (exit code 4). Tested by <code>SendFontAnalyticsCommandTests<\/code>.<\/p>","<p><b>Quality gate.<\/b> C#: the spreadsheet, sendFontAnalytics and console-loop tests ran at this tree, 425 passed. The 6 others are one fixture whose setup needs the front-end bundle, which this worktree hasn't built, so they could not run here. TypeScript: not run, because there is no front-end code in the diff. E2E repo check: did not apply, because no spec changed. Merged master; one trivial conflict in <code>SpreadsheetImporter.cs<\/code>, keeping both lines.<\/p>","<p><b>This run:<\/b> commented out the verb and its tests, moved the two backup tests to a live fixture, merged master, and rewrote the PR description and title. The force-push for a rebase was refused, so master was merged instead; the squash in request-peer-review tidies it.<\/p>","<p><b>Reviewers.<\/b> Local review (light sub-agent pass): clean. Devin: complete at d9280022aa; its one new item (the description was out of date) is fixed and <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8529#discussion_r4530068526\" target=\"_blank\" rel=\"noopener\">resolved<\/a>, and the rest repeat earlier, already-fixed items. Greptile: has not reviewed the current code (last saw 588611c76c); its open P1 is <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8529#discussion_r4449031437\" target=\"_blank\" rel=\"noopener\">answered and resolved<\/a>, and item 2 below is about it. CI: pr-automation passed; Reviewable is waiting on its human reviewers. Andrew's suggestion is answered on Reviewable.<\/p>"],"questions":[{"title":"Keep the in-app import fixes in this PR?","context":["<p>You asked to keep the fixes that help other command-line tasks. The fixes made while getting the command-line import working are in <code>SpreadsheetImporter<\/code>, which the Import menu inside Bloom also uses. They are: restoring the old recordings when an import fails before saving, always disposing the hidden helper browser, and a 20 s limit on loading its helper page. They help the in-app import, but they aren't command-line fixes, so this was a judgment call. I kept them. They change about 170 lines on the path every in-app spreadsheet import takes, though a successful import does the same as before. The commented-out command-line code also relies on them.<\/p>"],"options":[{"label":"Keep them (as now)","recommended":true,"why":"Recommended because each one fixes a real failure in the in-app import (recordings lost, a browser left running, a possible hang), and they're tested.","effort":"no change","instruction":"Keep the SpreadsheetImporter changes in PR #8529 (BloomBooks/BloomDesktop, branch BL-16773-cli-import-audio) as they are."},{"label":"Take them out; PR is only the retirement plus sendFontAnalytics","why":"Smallest PR, but the in-app import goes back to losing recordings on a failed import.","effort":"~30 min: revert SpreadsheetImporter.cs to master, delete SpreadsheetImportWithBackupTests.cs, note in the commented-out command that it needs them back","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\BL-16773-cli-import-audio (branch BL-16773-cli-import-audio, PR #8529), restore src/BloomExe/Spreadsheet/SpreadsheetImporter.cs to origin/master, delete src/BloomTests/Spreadsheet/SpreadsheetImportWithBackupTests.cs, add a note to the header of the commented-out SpreadsheetImportCommand.cs that it relies on ImportWithBackupAsync and the browser fixes from this PR's history, update the PR description, then re-run preflight."}],"leaveAsIs":"the in-app importer fixes stay in PR #8529."},{"title":"In-app import can delete the very recordings it is importing","context":["<p>Greptile found this on the command-line import, which is now retired, but the in-app import does the same, and has since before this PR. Import deletes the book's <code>audio<\/code> folder before it reads the spreadsheet's recordings. Export writes recordings to an <code>audio<\/code> folder beside the spreadsheet. So if someone exports a spreadsheet <i>into the book's own folder<\/i> and later imports it from there, the recordings the spreadsheet points to are deleted first. The import then reports each one as missing and saves the book without them. They are still in the backup zip Bloom makes first. This is likely rare.<\/p>"],"options":[{"label":"Make a YouTrack card for it","recommended":true,"why":"Recommended because it is pre-existing and rare, and fixing it is separate from this PR's purpose; a card keeps it from being forgotten.","effort":"no code; one card","instruction":"Create a YouTrack bug (youtrack-create-issue skill) on the current board: 'Spreadsheet import deletes recordings it is about to import when the spreadsheet's audio folder is the book's own audio folder'. Describe the export-into-book-folder scenario, the cause (SpreadsheetImporter.ImportWithBackupAsync clears <book>/audio before AddAudioFileAsync reads the spreadsheet's ./audio files), and that the backup zip still holds them. Mention it was found by Greptile on PR #8529."},{"label":"Fix it in this PR","why":"Closes the gap now, but adds scope to a PR that is otherwise shrinking.","effort":"~20-40 lines plus a test: when the spreadsheet's folder is the book folder, move the audio folder aside instead of deleting it and read recordings from there; moderate risk on the shared import path","instruction":"In C:\\Users\\JohnThomson\\orca\\workspaces\\BloomDesktop\\BL-16773-cli-import-audio (branch BL-16773-cli-import-audio, PR #8529), change SpreadsheetImporter.ImportWithBackupAsync so recordings the spreadsheet will read from the book's own audio folder are not lost: e.g. move the audio folder to a temporary sibling rather than deleting it, and have the importer read source recordings from there when the spreadsheet folder is the book folder; add a test in SpreadsheetImportWithBackupTests; then re-run preflight."}],"leaveAsIs":"the in-app import keeps deleting the book's audio folder before reading the spreadsheet's recordings.","codeComment":true},{"title":"Next step","context":["<p>Once these are answered, what should happen?<\/p>"],"options":[{"label":"Carry out my answers, then run request-peer-review","recommended":true,"why":"Recommended because nothing else is outstanding.","effort":"agent work","instruction":"Carry out the answers above for PR #8529; if that changes code, re-run preflight; then run the request-peer-review skill on branch BL-16773-cli-import-audio."},{"label":"Carry out my answers, then stop for my own review","why":"If you want to look at the PR yourself first.","effort":"agent work","instruction":"Carry out the answers above for PR #8529; if that changes code, re-run preflight; then stop and leave the PR in draft for John's own review."}],"leaveAsIs":"do nothing further for now."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
