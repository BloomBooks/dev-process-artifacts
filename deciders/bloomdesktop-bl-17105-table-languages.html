<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>
<!-- build-form.mjs puts the form's JSON here; see SKILL.md, "The form's JSON". -->
<script type="application/json" id="decider-form">{"date":"2026-11-16","about":"Preflight report: BloomDesktop PR 8583, branch BL-17105-table-languages (D:\\bloom\\table-languages)","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bl-17105-table-languages.html","context":["<p><a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583\" target=\"_blank\" rel=\"noopener\">PR #8583<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17105\" target=\"_blank\" rel=\"noopener\">BL-17105<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8583\" target=\"_blank\" rel=\"noopener\">Devin review<\/a><\/p>","<p><!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Draft PR<\/span><!-- pr-state:end --> · mergeable · bots done · 4 decisions waiting<\/p>","<h3>Purpose<\/h3><p>A table's text cells used to show every language the toolbar had turned on, so a word list could not have one column in the local language and the next in the national language. This lets the user choose, per cell, which collection languages a text cell shows, at the level of a cell, a row, a column or the whole table.<\/p>","<h3>What the PR does<\/h3><ul><li>A <b>Languages<\/b> item in the Cell, Row, Column and Table menus, with one check box per collection language, a dash when only some covered cells show it, and the last language of a cell locked. A change is one undo step, and still undoes after a table Undo rebuilds the cells.<\/li><li>The choice is stored as roles (V, N1, N2) on the cell's translation group, so it survives translation in another collection.<\/li><li>New cells and every existing table cell show L1 only; table cells no longer follow the toolbar. When a page is prepared, a cell gets a box for each language it shows and orders them by the collection; publishing's completeness check uses the same rule.<\/li><li>Languages travel into new rows and columns and through Paint format and Copy/Paste properties (bloom-table 0.1.2 → 0.1.6).<\/li><\/ul>","<h3>Quality gate (HEAD 6f0cba3619)<\/h3><ul><li>Typecheck and lint: pass.<\/li><li>TypeScript tests (vitest, table, cell-language, undo, inline-image files): 153 passed.<\/li><li>C# tests (TranslationGroupManagerTests, BookTests.AllPublishableLanguages): 64 passed.<\/li><li>E2E at the nightly window size (repo check): tables-cell-languages + tables-extended 29 passed, then tables-extended 4 more times, 25 passed each. One earlier run had one failure; see the second decision.<\/li><li>Merge: the branch was moved off an old copy of the BL-13502 commit onto master; one import conflict resolved.<\/li><\/ul>","<h3>This run<\/h3><p>Committed the work, put it on master, opened the draft PR, and fixed seven review findings: three from the light local review (undo after a table Undo, a new cell's language when the toolbar shows another first, publishing's completeness check), two from Devin, two from Greptile. <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a>.<\/p>","<h3>Reviewers<\/h3><ul><li><b>Local review (light sub-agent pass):<\/b> 3 bugs found, 3 fixed.<\/li><li><b>Walkaround with /simplify:<\/b> 13 cleanups applied on the first pass and 5 more after the review fixes; 3 design proposals (third decision).<\/li><li><b>Devin:<\/b> complete. 2 bugs on the first commit, both fixed and marked resolved by its re-review, which found nothing new.<\/li><li><b>Greptile:<\/b> complete on the first commit: 3 findings, 2 fixed and resolved, 1 open (first decision). It has not reviewed the fix commit.<\/li><li><b>CI:<\/b> pr-automation passed; nothing else runs on this PR.<\/li><li><b>Repo check (e2e at nightly size):<\/b> passed at HEAD.<\/li><\/ul>","<h3>Worth knowing<\/h3><ul><li>The PR description has no screenshots of the Languages submenu yet.<\/li><li>Paint format and Copy/Paste properties carrying languages, and inline pictures in a cell, are not covered by any automated test; the test ideas on the card point the tester at them.<\/li><\/ul>"],"questions":[{"title":"A newly ticked right-to-left language's box runs left to right until the page is reloaded","context":["<p>Greptile, <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583#discussion_r4591607475\" target=\"_blank\" rel=\"noopener\">on the PR<\/a>: when a user ticks a language written right to left (Arabic, say) for a cell that has no box in it yet, the new box is made in the browser without a text direction, so it runs left to right until the page is next loaded, when Bloom's C# sets <code>dir<\/code> as usual. Greptile is right about the behaviour.<\/p><p>The page has no way to know a language's direction today: the <code>settings/languageNames<\/code> request that the menu uses returns only names and tags. The canvas element's own Language menu has the same gap.<\/p>"],"options":[{"label":"Fix it: send each language's direction with the names, and set it on the new box","recommended":true,"why":"Recommended because a user typing Arabic into a box that runs the wrong way is a real problem, and it is visible at once.","effort":"~20 lines in the C# settings API and tableCellLanguages.ts, low risk","instruction":"In D:\\bloom\\table-languages (branch BL-17105-table-languages, PR 8583): make the settings/languageNames API (CollectionSettingsApi.cs) also return whether each collection language is right to left, add those fields to ILanguageNameValues and ICellLanguage, and in tableCellLanguages.ts addEditable set dir=\"rtl\" on a new box whose language is right to left. Add a unit test. Then reply on Greptile's thread 4591607475 and resolve it."}],"leaveAsIs":"a newly added right-to-left box runs left to right until the page is reloaded (also true of the canvas element's Language menu).","codeComment":true},{"title":"An unexplained e2e failure: a table inside a cell lost after the page was rebuilt","context":["<p>In the first e2e run, <code>tables-extended.spec.ts<\/code> › “holds a table inside a cell” failed once at “Rebuild the page, and check the inner table kept its text”: after going to another page and back, the cell that held the inner table showed an ordinary text box instead. The next six runs of the same file all passed.<\/p><p>The run's trace was deleted by the following run before I read it, so the cause is unknown. It could be this branch, or master's recent change to how a page is saved without reloading (BL-13502), which this branch now sits on. Losing a nested table on save would be a real bug for a user, so it is worth knowing which.<\/p>"],"options":[{"label":"Find it: repeat the spec on this branch and on master until it fails, keeping each failing trace","recommended":true,"why":"Recommended because a test that fails with no code change is reporting a real race, and this one may lose a user's table.","effort":"no code until found; about 3 minutes per run, perhaps 10–20 runs","instruction":"In D:\\bloom\\table-languages (branch BL-17105-table-languages): run src/BloomE2E/tests/tables-extended.spec.ts headless at the nightly viewport repeatedly, each run with its own --output folder, until “holds a table inside a cell” fails; read that trace and the saved page, and find why the nested table was lost. If it does not fail in 20 runs, run the same loop on a master worktree. Report the cause before fixing anything."},{"label":"File a card for it and move on","why":"Keeps this PR moving; someone looks at it separately.","effort":"no code","instruction":"Create a YouTrack card on the Bloom 6.6 board, Incoming, describing the one failure of tables-extended.spec.ts “holds a table inside a cell” at the page rebuild step on PR 8583 (1 in 7 runs, trace lost), and link it from the PR."}],"leaveAsIs":"one unexplained failure of “holds a table inside a cell” (1 in 7 runs) with no record of why."},{"title":"Walkaround proposals: how table cells store and apply their languages","context":["<p>The walkaround's reviewers suggested three deeper changes. None changes what a user sees today.<\/p><ol><li><b>A role of its own for “the collection's L1”.<\/b> A table cell stores <code>V<\/code>, which everywhere else means the toolbar's first language, so every reader of the setting (three places in C#, and Bloom Player) has to ask whether the group is in a table cell first. A new token used only by table cells would remove that. Against it: older Blooms and older Bloom Readers don't know the token, and a box whose setting they can't read shows nothing, so every table cell would go blank there.<\/li><li><b>Write the setting onto existing table cells once<\/b>, when a book is brought up to date, instead of reading “no setting” as L1-only forever. It saves one line of special-casing; the table-cell check stays because of point 1.<\/li><li><b>Share one helper with the canvas element's Language menu<\/b> for “make this group show these languages”, so the two don't drift (the canvas one also gives a new box its <code>bloom-content<\/code> classes and language tip, which the table's new boxes get only on the next page load).<\/li><\/ol>"],"options":[{"label":"Do 3 (shared helper); leave 1 and 2","recommended":true,"why":"Recommended because one helper is easier to keep right than two that already differ, while 1 would blank table cells in older readers and 2 gains almost nothing without 1.","effort":"~60 lines moved between tableCellLanguages.ts and canvasControlTextMenuItems.ts, moderate","instruction":"In D:\\bloom\\table-languages (branch BL-17105-table-languages): move the logic that makes a translation group show a set of languages (finding or adding the box for each, its bloom-content classes, language tip and visibility classes) into one shared function used by both tableCellLanguages.ts showRolesInGroup and canvasControlTextMenuItems.ts updateTranslationGroupLanguage, keeping both behaviours; run their tests."},{"label":"Do all three","why":"The cleanest code, at the cost of blank table cells in older Blooms and Bloom Readers.","effort":"large: a new stored token, Bloom Player support, a book migration","instruction":"In D:\\bloom\\table-languages (branch BL-17105-table-languages): introduce a data-default-languages token meaning the collection's first language, use it for table cells instead of V, handle it in ShouldNormallyShowEditable and Book.IsLanguageWantedInContent, stamp it on existing table cells when a book is brought up to date, share the group-language helper with the canvas element's menu, and open a bloom-player change for the token."}],"leaveAsIs":"table cells keep V with a table-specific meaning, read “no setting” as L1-only, and have their own helper beside the canvas element's."},{"title":"Next step","context":["<p>What should happen after these answers?<\/p>"],"options":[{"label":"Do the chosen items, then run preflight again","recommended":true,"why":"Recommended because each change is a new commit that the reviewers need to see.","effort":"depends on the answers above","instruction":"Carry out the chosen items on BL-17105-table-languages in D:\\bloom\\table-languages, then run /preflight again."},{"label":"Do the chosen items and stop","effort":"depends on the answers above","instruction":"Carry out the chosen items on BL-17105-table-languages in D:\\bloom\\table-languages, commit and push, and report; do not run preflight."}],"leaveAsIs":"nothing more happens until I say."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
