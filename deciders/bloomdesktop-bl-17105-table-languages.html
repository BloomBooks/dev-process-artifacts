<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisions</title>
<style>
:root{--ground:#FAF9F5;--card:#FFFFFF;--line:#E8E4DA;--ink:#2F2F2F;--muted:#6B6760;--accent:#D97757;--accent-strong:#B4532F;--accent-tint:#FBEEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:var(--accent-tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h2{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px}
.ctx,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.ctx p,.q p{margin:0 0 10px}
.ctx p:last-child{margin:0}
a{color:var(--accent-strong)}
code{font:13px ui-monospace,Consolas,monospace;background:#F3F0E8;padding:1px 4px;border-radius:4px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;border-radius:8px;margin:4px 0;cursor:pointer}
label.opt.rec{background:var(--accent-tint)}
label.opt.chosen{outline:1px solid var(--accent)}
label.opt input{margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.eff{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.row label.opt{margin:0}
.row .comment{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;padding:0 10px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent-strong)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.notes{width:100%;min-height:54px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--ground);color:var(--ink)}
.count{text-align:right;color:var(--muted);font-size:13.5px;min-height:20px}
.bar{display:flex;align-items:center;gap:10px}
.status{flex:1;color:var(--muted);font-size:13.5px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent-strong);cursor:pointer}
button.secondary{background:var(--card);color:var(--accent-strong)}
button.primary{background:var(--accent-strong);color:#fff}
button:disabled{opacity:.5;cursor:default}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button.done svg{margin-right:6px}
#copy:not(.done){padding:8px 10px}
#out{width:100%;min-height:200px;margin-top:10px;font:13px ui-monospace,Consolas,monospace}
</style>

<script type="application/json" id="decider-form">{"date":"2026-11-18","about":"Preflight report: BloomDesktop PR 8583, branch BL-17105-table-languages (D:\\bloom\\table-languages)","url":"https://bloombooks.github.io/dev-process-artifacts/deciders/bloomdesktop-bl-17105-table-languages.html","context":["<p><a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583\" target=\"_blank\" rel=\"noopener\">PR #8583<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/files\" target=\"_blank\" rel=\"noopener\">Files changed<\/a> · <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/commits\" target=\"_blank\" rel=\"noopener\">Commits<\/a> · <a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17105\" target=\"_blank\" rel=\"noopener\">BL-17105<\/a> · <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8583\" target=\"_blank\" rel=\"noopener\">Devin review<\/a><\/p>","<p><!-- pr-state:begin --><span class=\"chip\" data-pr-state=\"draft\">Draft PR<\/span><!-- pr-state:end --> · mergeable · bots done · 3 decisions waiting<\/p>","<h3>Purpose<\/h3><p>A table's text cells used to show every language the toolbar had turned on, so a word list could not have one column in the local language and the next in the national language. This lets the user choose, per cell, which collection languages a text cell shows, at the level of a cell, a row, a column or the whole table.<\/p>","<h3>What the PR does<\/h3><ul><li>A <b>Languages<\/b> item in the Cell, Row, Column and Table menus, with one check box per collection language, a dash when only some covered cells show it, and the last language of a cell locked. A change is one undo step, and still undoes after a table Undo rebuilds the cells.<\/li><li>The choice is stored as roles (V, N1, N2) on the cell's translation group, so it survives translation in another collection.<\/li><li>New cells and every existing table cell show L1 only; table cells no longer follow the toolbar. When a page is prepared, a cell gets a box for each language it shows and orders them by the collection; publishing's completeness check uses the same rule.<\/li><li>Languages travel into new rows and columns and through Paint format and Copy/Paste properties (bloom-table 0.1.2 → 0.1.6).<\/li><\/ul>","<h3>Quality gate (HEAD a5bf9fc4e5)<\/h3><ul><li>Typecheck, lint and formatting: pass (front end and e2e).<\/li><li>TypeScript tests (vitest, files related to the change): <span class=\"numeral\">832 passed<\/span>.<\/li><li>C# tests (ExportEpubTests, TranslationGroupManagerTests, BookTests.AllPublishableLanguages): <span class=\"numeral\">170 passed<\/span>, run before the master merge, which touched none of them.<\/li><li>E2E at the nightly window size (repo check), the four changed specs: <span class=\"numeral\">36 passed<\/span>, plus the after-new-row test failing as its <code>test.fail()<\/code> expects; tables-cell-languages again after the last commit: <span class=\"numeral\">9 passed<\/span>.<\/li><li>Merge: master merged in. bloom-table stays at 0.1.6, whose source includes master's 0.1.5 (the host supplies the table's translations); imports in tableEditing.ts and the e2e table helpers combined.<\/li><\/ul>","<h3>This run<\/h3><p>Another session had committed and pushed tests for every item on the card (<a href=\"https://github.com/BloomBooks/BloomDesktop/commit/9f326b09f8\" target=\"_blank\" rel=\"noopener\">9f326b09f8<\/a>). This run found why one of them fails, tidied the tests (<a href=\"https://github.com/BloomBooks/BloomDesktop/commit/b746227ced\" target=\"_blank\" rel=\"noopener\">b746227ced<\/a>), merged master, and fixed Devin's one flag (<a href=\"https://github.com/BloomBooks/BloomDesktop/commit/a5bf9fc4e5\" target=\"_blank\" rel=\"noopener\">a5bf9fc4e5<\/a>). <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583/commits\" target=\"_blank\" rel=\"noopener\">All commits<\/a>.<\/p>","<h3>Reviewers<\/h3><ul><li><b>Local review (light sub-agent pass):<\/b> one finding, confirmed by a run: the right-to-left test passes with the line it is meant to check taken out. See the first decision.<\/li><li><b>Walkaround with /simplify:<\/b> 9 cleanups in the new test code; 2 proposals, which are the first two decisions.<\/li><li><b>Devin:<\/b> complete at a5bf9fc4e5. One Investigate flag, <a href=\"https://github.com/BloomBooks/BloomDesktop/pull/8583#discussion_r4607572234\" target=\"_blank\" rel=\"noopener\">fixed and resolved<\/a>; nothing else new. <a href=\"https://devinreview.com/BloomBooks/BloomDesktop/pull/8583\" target=\"_blank\" rel=\"noopener\">Review page<\/a>.<\/li><li><b>Greptile:<\/b> has not reviewed the current code; its one review was of the first push. Not re-triggered, since the code that changed after it is the right-to-left change and test code.<\/li><li><b>CI:<\/b> pr-automation passed.<\/li><li><b>Reviewable:<\/b> every discussion has a reply; two mirrored Devin threads stay open until you mark them.<\/li><\/ul>","<h3>Worth knowing<\/h3><ul><li>Two tables-extended tests each failed once (a table inside a cell lost; the Undo button staying grey after choosing Table in Change Layout). Neither came back in about 45 and 100 later runs on this branch, nor in 16 runs on master. No cause found.<\/li><li>The PR description has no screenshots of the Languages submenu yet.<\/li><\/ul>"],"questions":[{"title":"The right-to-left change made nothing different: a new Arabic box already ran right to left","context":["<p>Greptile said a box added for a right-to-left language would run left to right until the page reloaded, and on the last report you chose to fix it. So <a href=\"https://github.com/BloomBooks/BloomDesktop/commit/5bd8377936\" target=\"_blank\" rel=\"noopener\">5bd8377936<\/a> makes <code>settings/languageNames<\/code> send each language's direction, carries it into the cell code, and sets <code>dir=\"rtl\"<\/code> on the new box (<a href=\"https://github.com/BloomBooks/BloomDesktop/blob/a5bf9fc4e50f96784a775a5e35cd7bff7f2c70a8/src/BloomBrowserUI/bookEdit/js/tableCellLanguages.ts#L207\" target=\"_blank\" rel=\"noopener\">tableCellLanguages.ts:207<\/a>).<\/p><p>This run's review found that the book's own stylesheet already gives every box in a right-to-left language its direction: Bloom writes <code>[lang='ar'] { direction: rtl; }<\/code> into the book from the collection setting, and that rule applies to a box made after the page loaded too. I ran the right-to-left e2e test with the <code>dir<\/code> line taken out, and it passed. I made the change on Greptile's word without first showing the bug, which I should have done.<\/p>"],"options":[{"label":"Take the change back out, keep the e2e test, and correct the record on Greptile's thread","recommended":true,"why":"Recommended because it is code and an API field that change nothing a user sees; the e2e test still checks that a new Arabic box runs right to left.","effort":"about 35 lines removed across CollectionSettingsApi.cs, canvasControlTypes.ts, tableCellLanguages.ts and its unit test","instruction":"In D:\\bloom\\table-languages (branch BL-17105-table-languages, PR 8583): revert the right-to-left plumbing from 5bd8377936 (the languageNIsRightToLeft fields in CollectionSettingsApi.cs HandleGetLanguageNames and ILanguageNameValues, ICellLanguage.isRightToLeft, the dir line in addEditable, and its unit test), keeping the CollectionSettingsApi `settings` local and keeping tables-cell-languages-rtl.spec.ts. Update the PR description and the test ideas to match. Reply on Greptile's thread 4591607475 that the box already ran right to left from the book's stylesheet ([lang] direction rule), so the change was taken out, then resolve it."},{"label":"Keep it, so a new box carries the same dir attribute that page load writes","why":"Keeps a new box's markup the same as a loaded one's; nothing a user sees depends on it today.","effort":"a reply on Greptile's thread","instruction":"In D:\\bloom\\table-languages (PR 8583): keep the right-to-left change. Reply on Greptile's thread 4591607475 that the box already ran right to left from the book's stylesheet, and that the dir attribute is kept so a new box matches what page load writes."}],"leaveAsIs":"the change stays, and the reply on Greptile's thread still says it fixed something.","codeComment":true},{"title":"After a row is added, a newly ticked language's box may not fit its cell, and a click on its middle starts a row resize","context":["<p>The other session's <a href=\"https://github.com/BloomBooks/BloomDesktop/blob/a5bf9fc4e50f96784a775a5e35cd7bff7f2c70a8/src/BloomE2E/tests/tables-cell-languages-after-new-row.spec.ts\" target=\"_blank\" rel=\"noopener\">tables-cell-languages-after-new-row.spec.ts<\/a> is marked <code>test.fail()<\/code>: after a row is added, a click in the French box that a cell then gains does not put the cursor there.<\/p><p>The cause: the table's canvas element keeps its height, so a third row makes every row shorter (about 67 px from 100). The cell's English and French boxes need about 78 px, so the French box runs past the bottom of its cell. The test clicks the middle of the box, which lies within 5 px of the cell's bottom edge, and a press there starts a row resize (the table library's rule, which <a href=\"https://github.com/BloomBooks/BloomDesktop/blob/a5bf9fc4e50f96784a775a5e35cd7bff7f2c70a8/src/BloomBrowserUI/bookEdit/js/canvasElementManager/CanvasElementPointerInteractions.ts#L387\" target=\"_blank\" rel=\"noopener\">CanvasElementPointerInteractions.ts<\/a> hands it). A click higher in the box, or below the cell, works. On master the same happens when typing makes a cell's text taller than its row.<\/p><p><a href=\"https://issues.bloomlibrary.org/youtrack/issue/BL-17110\" target=\"_blank\" rel=\"noopener\">BL-17110<\/a> (in code review) cuts off text that does not fit its cell and marks the cell red, which tells a person to make the row taller.<\/p>"],"options":[{"label":"Hand the case to BL-17110: take the spec out of this PR and describe it on that card","recommended":true,"why":"Recommended because the box not fitting its cell is the overflow BL-17110 deals with, and once it shows red a person knows to grow the row; this PR's own feature works.","effort":"one file removed, a comment on BL-17110, the PR description and test ideas updated","instruction":"In D:\\bloom\\table-languages (PR 8583): delete src/BloomE2E/tests/tables-cell-languages-after-new-row.spec.ts and the comment in tables-cell-languages.spec.ts that points to it; post a comment on BL-17110 describing the case (a language ticked after a row is added gives a box that runs past its cell; a press within 5 px of the cell's bottom edge starts a row resize) and its cause; update the PR description and the test ideas."},{"label":"Let the table grow: when a cell gains a language box, make the canvas element tall enough for it","why":"A new box would always fit, but it changes how a table on a canvas sizes itself, which is BL-17110's ground.","effort":"unknown until designed; touches canvas element sizing","instruction":"In D:\\bloom\\table-languages (PR 8583): when a language box is added to a table cell, grow the table's canvas element so every cell's content fits; then remove test.fail() from tables-cell-languages-after-new-row.spec.ts and run it."}],"leaveAsIs":"the test stays here marked test.fail(), and the PR description says the case waits on a decision.","codeComment":false},{"title":"Next step","context":["<p>What should happen after these answers?<\/p>"],"options":[{"label":"Do the chosen items, then run preflight again","recommended":true,"why":"Recommended because each change is a new commit that the reviewers need to see.","effort":"depends on the answers above","instruction":"Carry out the chosen items on BL-17105-table-languages in D:\\bloom\\table-languages, then run /preflight again."},{"label":"Do the chosen items and stop","effort":"depends on the answers above","instruction":"Carry out the chosen items on BL-17105-table-languages in D:\\bloom\\table-languages, commit and push, and report; do not run preflight."}],"leaveAsIs":"nothing more happens until I say."}]}</script>
</head>
<body>
<main>
<div id="questions"></div>
<div id="copyback">
<div class="count" id="count"></div>
<div class="bar">
<div class="status" id="status"></div>
<button class="secondary" id="copy" type="button" title="Copy answers" aria-label="Copy answers"></button>
<button class="primary" id="send" type="button" disabled>Send to Claude</button>
</div>
<textarea id="out" readonly hidden></textarea>
</div>
</main>
<script>
(async () => {
const FORM = JSON.parse(document.getElementById("decider-form").textContent);
const Q = FORM.questions;
let sending = false;
let sent = false;   // the answers as they stand went to Claude; any change to them clears it
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const host = document.getElementById("questions");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (FORM.context && FORM.context.length) {
  const block = document.createElement("section");
  block.className = "ctx";
  block.innerHTML = FORM.context.map(p => `<p>${p}</p>`).join("");
  host.appendChild(block);
}

// Context paragraphs are HTML that the agent wrote; labels and the rest are plain text.
Q.forEach((q, qi) => {
  const card = document.createElement("section");
  card.className = "q";
  const name = "q" + qi;
  let h = `<h2>${esc(q.title)}</h2>` + (q.context || []).map(p => `<p>${p}</p>`).join("");
  if (q.leaveAsIsRecommended) h += `<p>${q.leaveAsIsRecommended}</p>`;
  (q.options || []).forEach((o, i) => {
    h += `<label class="opt${o.recommended ? " rec" : ""}"><input type="radio" name="${name}" value="${i}" data-q="${qi}">` +
      `<span>${esc(o.label)}${o.recommended ? '<span class="tag">Recommended</span>' : ""}` +
      `${o.why ? " " + esc(o.why) : ""}${o.effort ? ` <span class="eff">(${esc(o.effort)})</span>` : ""}</span></label>`;
  });
  h += `<div class="row"><label class="opt${q.leaveAsIsRecommended ? " rec" : ""}"><input type="radio" name="${name}" value="leave" data-q="${qi}">` +
    `<span>Leave as is${q.leaveAsIsRecommended ? '<span class="tag">Recommended</span>' : ""}</span></label>` +
    `<label class="opt"><input type="radio" name="${name}" value="other" data-q="${qi}"><span>Other:</span></label>`;
  if (q.codeComment) h += `<label class="comment"><input type="checkbox" data-q="${qi}" data-kind="comment"> Leave comment</label>`;
  h += `</div><textarea class="notes" data-q="${qi}" data-kind="notes" placeholder="Notes"></textarea>`;
  card.innerHTML = h;
  host.appendChild(card);
});

const chosen = qi => { const r = document.querySelector(`input[name="q${qi}"]:checked`); return r ? r.value : null; };
const notes = qi => document.querySelector(`textarea[data-q="${qi}"]`).value.trim();
const answered = qi => { const c = chosen(qi); return c !== null && !(c === "other" && !notes(qi)); };

function serialize() {
  const lines = ["Decisions from a decider form", `About: ${FORM.about}`, `Date: ${FORM.date}`];
  if (FORM.url) lines.push(`Form: ${FORM.url}`);
  lines.push("");
  Q.forEach((q, qi) => {
    lines.push(q.title);
    const c = chosen(qi), n = notes(qi);
    if (!answered(qi)) {
      lines.push(`No decision yet — ask again later about: ${q.title}`);
      if (n) lines.push(`Notes: ${n}`);
    } else if (c === "other") {
      lines.push(`Other: ${n}`);
    } else {
      lines.push(c === "leave" ? `Leave as is — take no action on: ${q.leaveAsIs}` : q.options[+c].instruction);
      if (n) lines.push(`Notes: ${n}`);
    }
    const cb = document.querySelector(`input[data-kind="comment"][data-q="${qi}"]`);
    if (cb && cb.checked) lines.push("Also record this decision as a code comment near the code it concerns.");
    lines.push("");
  });
  return lines.join("\n").trim();
}

const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
function refresh() {
  const left = Q.filter((_, qi) => !answered(qi)).length;
  countEl.textContent = left ? `${left} unanswered` : "";
  sendBtn.disabled = sending || (!sent && Q.every((_, qi) => chosen(qi) === null));
  document.querySelectorAll("label.opt").forEach(l => l.classList.toggle("chosen", l.querySelector("input").checked));
}
// After a copy or a send, the buttons say so ("Copied", an outlined "Sent") until the answers
// change, when they go back to copying and sending the new answers.
const copyBtn = document.getElementById("copy");
function showCopy(done) {
  copyBtn.classList.toggle("done", done);
  copyBtn.innerHTML = done ? CHECK + "Copied" : COPY;
}
function showSent(done) {
  sent = done;
  sendBtn.className = done ? "secondary done" : "primary";
  sendBtn.innerHTML = done ? CHECK + "Sent" : "Send to Claude";
}
function answersChanged() {
  showCopy(false);
  if (sent) showSent(false);
}
showCopy(false);
document.addEventListener("change", e => {
  answersChanged();
  const t = e.target;
  if (t.type !== "radio") { refresh(); return; }
  const ta = document.querySelector(`textarea[data-q="${t.dataset.q}"]`);
  ta.placeholder = t.value === "other" ? "What should happen instead?" : "Notes";
  if (t.value === "other") ta.focus();
  refresh();
});
document.addEventListener("input", e => { if (e.target.id !== "out") answersChanged(); refresh(); });

document.getElementById("copy").addEventListener("click", async () => {
  try {
    const out = document.getElementById("out");
    out.value = serialize();
    out.hidden = false;
    out.select();
    try { await navigator.clipboard.writeText(out.value); statusEl.textContent = ""; showCopy(true); return; } catch {}
    out.select();
    if (document.execCommand("copy")) { statusEl.textContent = ""; showCopy(true); return; }
    statusEl.textContent = "Couldn't copy automatically — the text is selected below; press Ctrl+C (⌘C on Mac).";
  } catch {
    statusEl.textContent = "Couldn't copy automatically — select the text below and copy it.";
  }
});

// Two ways back to the session: claude-decider.mjs's endpoint when it serves the page, or the
// Artifact comments capability when the page is a published Artifact. Neither: Copy only.
const endpoint = window.DECIDER_ENDPOINT;
let comments = null;
if (!endpoint) { try { comments = await window.claude?.use?.("comments"); } catch {} }
if (!endpoint && !comments) sendBtn.hidden = true;
const COMMENT_ERRORS = {
  consent_required: "This page hasn't been allowed to comment yet.",
  forbidden: "This page may not post comments.",
  claude_unavailable: "Claude couldn't be reached, and nothing was posted.",
};
const UNAVAILABLE = {
  writers_only: "Only an editor of this page can send to Claude.",
  no_session: "No Claude session is watching this page.",
  off: "Sending to Claude is turned off for this page.",
};

sendBtn.addEventListener("click", async () => {
  if (sent) return;
  const text = serialize();
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  statusEl.textContent = "Sending your answers to Claude…";
  try {
    if (endpoint) {
      const r = await fetch(endpoint, { method: "POST", headers: { "content-type": "text/plain; charset=utf-8" }, body: text });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      statusEl.textContent = "";
      showSent(true);
    } else {
      const bytes = new TextEncoder().encode(text).length;
      if (bytes > 4096) { statusEl.textContent = `The answers are ${bytes} bytes, over the 4096 a comment holds. Shorten your notes, or use the copy button.`; return; }
      const state = await comments.canSendToClaude();
      if (state !== "available") { statusEl.textContent = `${UNAVAILABLE[state] || "Can't send: " + state + "."} Use the copy button.`; return; }
      const anchor = await comments.anchorFor(document.getElementById("copyback"));
      await comments.sendToClaude({ anchor, text });
      statusEl.textContent = "Claude's reply will appear in the comment on this section.";
      showSent(true);
    }
  } catch (e) {
    if (e && e.code === "forbidden") sendBtn.hidden = true;
    statusEl.textContent = `${(e && COMMENT_ERRORS[e.code]) || "Couldn't send (" + ((e && (e.code || e.message)) || e) + ")."} Use the copy button.`;
  } finally {
    sending = false;
    if (!sent) showSent(false);
    refresh();
  }
});
refresh();
})();
</script>
</body>
</html>
